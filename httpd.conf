# ============================================================
# VIRGOZKI APACHE HTTPD
#
# Apache :127.0.0.1:8083
#
# HTTP / WebSocket / HTTPUpgrade / XHTTP ONLY
#
# Apache -> Xray
# ============================================================


ServerName 127.0.0.1


Listen 127.0.0.1:8083



# ============================================================
# HARDENING
# ============================================================


ServerTokens Prod

ServerSignature Off


Timeout 3600


KeepAlive On

KeepAliveTimeout 5

MaxKeepAliveRequests 1000



TraceEnable Off



ProxyRequests Off

ProxyPreserveHost On

ProxyAddHeaders On


ProxyTimeout 3600





# ============================================================
# MODULE SETTINGS
# ============================================================


Protocols http/1.1



# ============================================================
# HEADERS
# ============================================================


<IfModule mod_headers.c>


    RequestHeader set X-Forwarded-Proto "http"

    RequestHeader set X-Forwarded-Port "8080"


    Header always unset Server


</IfModule>





# ============================================================
# SECURITY
# ============================================================


<Directory />

    Require all denied

</Directory>





# ============================================================
# TROJAN
# ============================================================


# XHTTP

ProxyPass        "/openresty/trojan-virgozki-xhttp" \
"http://127.0.0.1:10002/openresty/trojan-virgozki-xhttp"


ProxyPassReverse "/openresty/trojan-virgozki-xhttp" \
"http://127.0.0.1:10002/openresty/trojan-virgozki-xhttp"



# HTTPUpgrade

ProxyPass        "/openresty/trojan-virgozki-hu" \
"http://127.0.0.1:10001/openresty/trojan-virgozki-hu"


ProxyPassReverse "/openresty/trojan-virgozki-hu" \
"http://127.0.0.1:10001/openresty/trojan-virgozki-hu"



# WebSocket

ProxyPass        "/openresty/trojan-virgozki" \
"ws://127.0.0.1:10000/openresty/trojan-virgozki"


ProxyPassReverse "/openresty/trojan-virgozki" \
"ws://127.0.0.1:10000/openresty/trojan-virgozki"







