# ============================================================
# gRPC
# ============================================================

# Trojan gRPC
ProxyPass        "/openresty/trojan-grpc" "h2c://127.0.0.1:10003/openresty/trojan-grpc"
ProxyPassReverse "/openresty/trojan-grpc" "http://127.0.0.1:10003/openresty/trojan-grpc"

# VMess gRPC
ProxyPass        "/openresty/vmess-grpc" "h2c://127.0.0.1:10007/openresty/vmess-grpc"
ProxyPassReverse "/openresty/vmess-grpc" "http://127.0.0.1:10007/openresty/vmess-grpc"

# VLESS gRPC
