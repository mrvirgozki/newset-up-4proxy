# ============================================================
# VIRGOZKI APACHE - FIXED NO DISCONNECT VERSION
# Nakikinig sa 127.0.0.1:8083, walang putol na koneksyon
# ============================================================

ServerName 127.0.0.1
Listen 127.0.0.1:8083

# ============================================================
# SIGURADUHIN NAKA-ENABLE ANG MGA KAILANGANG MODULE
# ============================================================
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule headers_module modules/mod_headers.so

# ============================================================
# HARDENING + WALANG PUTOL NA TIMEOUT
# ============================================================
ServerTokens Prod
ServerSignature Off

# ✅ Sobrang habang timeout para hindi maputol
Timeout 86400
ProxyTimeout 86400
ProxyConnectTimeout 10

KeepAlive On
KeepAliveTimeout 7200
MaxKeepAliveRequests 0

TraceEnable Off
ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders Off
AllowEncodedSlashes NoDecode
Protocols http/1.1

# ============================================================
# CRITICAL: PARA SA WEBSOCKET / HTTPUPGRADE / XHTTP
# ============================================================
<IfModule mod_headers.c>
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "8080"
    Header always unset Server

    # ✅ AUTOMATIC IPASA ANG UPGRADE HEADERS
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /openresty/ - [E=UPGRADE_WS:1]
    RequestHeader set Upgrade "websocket" env=UPGRADE_WS
    RequestHeader set Connection "Upgrade" env=UPGRADE_WS
</IfModule>

# ============================================================
# SECURITY
# ============================================================
<Directory />
    Require all denied
</Directory>

# ============================================================
# TROJAN - WALANG PUTOL
# ============================================================
# WebSocket
ProxyPass        "/openresty/trojan-virgozki" "ws://127.0.0.1:10000" keepalive=on
ProxyPassReverse "/openresty/trojan-virgozki" "ws://127.0.0.1:10000"

# HTTPUpgrade
ProxyPass        "/openresty/trojan-virgozki-hu" "http://127.0.0.1:10001" keepalive=on upgrade=websocket
ProxyPassReverse "/openresty/trojan-virgozki-hu" "http://127.0.0.1:10001"

# XHTTP (gamit WS tunnel para walang putol)
ProxyPass        "/openresty/trojan-virgozki-xhttp" "ws://127.0.0.1:10002" keepalive=on
ProxyPassReverse "/openresty/trojan-virgozki-xhttp" "ws://127.0.0.1:10002"

# ============================================================
# VMESS - WALANG PUTOL
# ============================================================
ProxyPass        "/openresty/vmess-virgozki" "ws://127.0.0.1:10004" keepalive=on
ProxyPassReverse "/openresty/vmess-virgozki" "ws://127.0.0.1:10004"

ProxyPass        "/openresty/vmess-virgozki-hu" "http://127.0.0.1:10005" keepalive=on upgrade=websocket
ProxyPassReverse "/openresty/vmess-virgozki-hu" "http://127.0.0.1:10005"

ProxyPass        "/openresty/vmess-virgozki-xhttp" "ws://127.0.0.1:10006" keepalive=on
ProxyPassReverse "/openresty/vmess-virgozki-xhttp" "ws://127.0.0.1:10006"

# ============================================================
# VLESS - WALANG PUTOL
# ============================================================
ProxyPass        "/openresty/vless-virgozki" "ws://127.0.0.1:10008" keepalive=on
ProxyPassReverse "/openresty/vless-virgozki" "ws://127.0.0.1:10008"

ProxyPass        "/openresty/vless-virgozki-hu" "http://127.0.0.1:10009" keepalive=on upgrade=websocket
ProxyPassReverse "/openresty/vless-virgozki-hu" "http://127.0.0.1:10009"

ProxyPass        "/openresty/vless-virgozki-xhttp" "ws://127.0.0.1:10010" keepalive=on
ProxyPassReverse "/openresty/vless-virgozki-xhttp" "ws://127.0.0.1:10010"

# ============================================================
# SHADOWSOCKS - WALANG PUTOL
# ============================================================
ProxyPass        "/openresty/ss-virgozki" "ws://127.0.0.1:10012" keepalive=on
ProxyPassReverse "/openresty/ss-virgozki" "ws://127.0.0.1:10012"

ProxyPass        "/openresty/ss-virgozki-hu" "http://127.0.0.1:10013" keepalive=on upgrade=websocket
ProxyPassReverse "/openresty/ss-virgozki-hu" "http://127.0.0.1:10013"

ProxyPass        "/openresty/ss-virgozki-xhttp" "ws://127.0.0.1:10014" keepalive=on
ProxyPassReverse "/openresty/ss-virgozki-xhttp" "ws://127.0.0.1:10014"
