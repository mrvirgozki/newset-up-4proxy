ServerName localhost
Listen 127.0.0.1:8083

ServerTokens Prod
ServerSignature Off

Timeout 3600
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5

Protocols h2 h2c http/1.1
H2Direct on

ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders On
ProxyTimeout 3600

DocumentRoot /usr/share/nginx/html

<Directory /usr/share/nginx/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html


# ============================================================
# HEALTH CHECK (INSTANT 200 OK WITHOUT FILE DEPENDENCY)
# ============================================================
<Location "/health">
    Require all granted
    SetHandler default-handler
    Header always set Content-Type "text/plain"
    ErrorDocument 200 "ok"
    Redirect 200 /health
</Location>


# ============================================================
# SECURITY HEADERS
# ============================================================
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "no-referrer-when-downgrade"
Header always set X-XSS-Protection "1; mode=block"


# ============================================================
# PROXY ROUTING (ENVOY BACKEND :8080)
# ============================================================

# --- WEBSOCKETS ---
ProxyPassMatch "^/(virgozki|vmess-virgozki|vless-virgozki|ss-virgozki)" "ws://127.0.0.1:8080/"
ProxyPassReverse "^/(virgozki|vmess-virgozki|vless-virgozki|ss-virgozki)" "ws://127.0.0.1:8080/"

# --- HTTP / HTTP UPGRADE / XHTTP ---
ProxyPass /virgozki-hu http://127.0.0.1:8080/virgozki-hu upgrade=websocket
ProxyPass /virgozki-xhttp http://127.0.0.1:8080/virgozki-xhttp

# --- gRPC (H2C UPSTREAM) ---
ProxyPass /vless-grpc-virgozki/ h2c://127.0.0.1:8080/vless-grpc-virgozki/
ProxyPass /vmess-grpc-virgozki/ h2c://127.0.0.1:8080/vmess-grpc-virgozki/


# ============================================================
# LOGGING
# ============================================================
ErrorLog /proc/self/fd/2
LogFormat "%h %l %u %t \"%r\" %>s %b" combined
CustomLog /proc/self/fd/1 combined
