ServerName localhost

Listen 127.0.0.1:8083

ServerTokens Prod
ServerSignature Off

Timeout 3600

KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5

Protocols h2 h2c http/1.1
H2Direct on

ProxyRequests Off
ProxyPreserveHost Off
ProxyAddHeaders On
ProxyTimeout 3600

DocumentRoot /usr/share/nginx/html

<Directory /usr/share/nginx/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html


# ============================================================
# HEALTH
# ============================================================

<Location "/health">
    Require all granted
    Header always set Content-Type "text/plain"
</Location>


# ============================================================
# WEBSOCKET / HTTPUPGRADE / XHTTP
# Apache remains available as an internal fallback.
# ============================================================

ProxyPass        "/virgozki"        "http://127.0.0.1:10000/virgozki"        upgrade=websocket
ProxyPassReverse "/virgozki"        "http://127.0.0.1:10000/virgozki"

ProxyPass        "/virgozki-hu"     "http://127.0.0.1:10001/virgozki-hu"     upgrade=websocket
ProxyPassReverse "/virgozki-hu"     "http://127.0.0.1:10001/virgozki-hu"

ProxyPass        "/virgozki-xhttp"  "http://127.0.0.1:10002/virgozki-xhttp"
ProxyPassReverse "/virgozki-xhttp"  "http://127.0.0.1:10002/virgozki-xhttp"


ProxyPass        "/vmess-virgozki"       "http://127.0.0.1:10003/vmess-virgozki"       upgrade=websocket
ProxyPassReverse "/vmess-virgozki"       "http://127.0.0.1:10003/vmess-virgozki"

ProxyPass        "/vmess-virgozki-hu"    "http://127.0.0.1:10004/vmess-virgozki-hu"    upgrade=websocket
ProxyPassReverse "/vmess-virgozki-hu"    "http://127.0.0.1:10004/vmess-virgozki-hu"

ProxyPass        "/vmess-virgozki-xhttp" "http://127.0.0.1:10005/vmess-virgozki-xhttp"
ProxyPassReverse "/vmess-virgozki-xhttp" "http://127.0.0.1:10005/vmess-virgozki-xhttp"


ProxyPass        "/vless-virgozki"       "http://127.0.0.1:10006/vless-virgozki"       upgrade=websocket
ProxyPassReverse "/vless-virgozki"       "http://127.0.0.1:10006/vless-virgozki"

ProxyPass        "/vless-virgozki-hu"    "http://127.0.0.1:10007/vless-virgozki-hu"    upgrade=websocket
ProxyPassReverse "/vless-virgozki-hu"    "http://127.0.0.1:10007/vless-virgozki-hu"

ProxyPass        "/vless-virgozki-xhttp" "http://127.0.0.1:10008/vless-virgozki-xhttp"
ProxyPassReverse "/vless-virgozki-xhttp" "http://127.0.0.1:10008/vless-virgozki-xhttp"


ProxyPass        "/ss-virgozki"       "http://127.0.0.1:10009/ss-virgozki"       upgrade=websocket
ProxyPassReverse "/ss-virgozki"       "http://127.0.0.1:10009/ss-virgozki"

ProxyPass        "/ss-virgozki-hu"    "http://127.0.0.1:10010/ss-virgozki-hu"    upgrade=websocket
ProxyPassReverse "/ss-virgozki-hu"    "http://127.0.0.1:10010/ss-virgozki-hu"

ProxyPass        "/ss-virgozki-xhttp" "http://127.0.0.1:10011/ss-virgozki-xhttp"
ProxyPassReverse "/ss-virgozki-xhttp" "http://127.0.0.1:10011/ss-virgozki-xhttp"


# ============================================================
# SECURITY HEADERS
# ============================================================

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "no-referrer-when-downgrade"
Header always set X-XSS-Protection "1; mode=block"


# ============================================================
# LOGGING
# ============================================================

ErrorLog /proc/self/fd/2

LogFormat "%h %l %u %t \"%r\" %>s %b" combined
CustomLog /proc/self/fd/1 combined
