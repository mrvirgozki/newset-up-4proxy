ServerName 127.0.0.1

Listen 127.0.0.1:8083

ServerTokens Prod
ServerSignature Off

Timeout 3600
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 1000

ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders On

# HTTP/2 cleartext + HTTP/1.1
Protocols h2c http/1.1
H2Direct on

<IfModule mod_headers.c>
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "8080"

    Header always unset Server
</IfModule>

<Directory />
    Require all denied
</Directory>

ProxyTimeout 3600


# ============================================================
# TROJAN
# ============================================================

ProxyPass        "/openresty/trojan-virgozki-xhttp" "http://127.0.0.1:10002/openresty/trojan-virgozki-xhttp"
ProxyPassReverse "/openresty/trojan-virgozki-xhttp" "http://127.0.0.1:10002/openresty/trojan-virgozki-xhttp"

ProxyPass        "/openresty/trojan-virgozki-hu" "http://127.0.0.1:10001/openresty/trojan-virgozki-hu"
ProxyPassReverse "/openresty/trojan-virgozki-hu" "http://127.0.0.1:10001/openresty/trojan-virgozki-hu"

ProxyPass        "/openresty/trojan-virgozki" "http://127.0.0.1:10000/openresty/trojan-virgozki" upgrade=websocket
ProxyPassReverse "/openresty/trojan-virgozki" "http://127.0.0.1:10000/openresty/trojan-virgozki"


