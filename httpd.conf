# WebSocket
ProxyPass        "/openresty/vmess-virgozki" "http://127.0.0.1:10004/openresty/vmess-virgozki" upgrade=websocket
ProxyPassReverse "/openresty/vmess-virgozki" "http://127.0.0.1:10004/openresty/vmess-virgozki"

# ============================================================
