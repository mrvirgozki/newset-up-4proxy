# ============================================================
# VIRGOZKI HAProxy
#
# INTERNAL ONLY
#
# HTTP:
#   127.0.0.1:8081 -> Envoy :8080
#
# gRPC/TCP:
#   127.0.0.1:8086 -> Envoy :8080
#
# IMPORTANT:
#   OpenResty uses :8084
#   Therefore HAProxy must NOT use :8084
# ============================================================


# ============================================================
# GLOBAL
# ============================================================

global
    log stdout format raw local0
    maxconn 10000
    user root
    group root


# ============================================================
# DEFAULTS
# ============================================================

defaults
    log global
    option dontlognull
    option httplog
    option http-server-close
    option forwardfor

    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s
    timeout http-request 15s
    timeout http-keep-alive 30s


# ============================================================
# HTTP FRONTEND
# ============================================================

frontend http_front
    bind 127.0.0.1:8081
    mode http

    http-request deny deny_status 400 if !{ req.hdr(host) -m found }

    default_backend envoy_http_backend


# ============================================================
# gRPC / TCP FRONTEND
# ============================================================

frontend grpc_front
    bind 127.0.0.1:8086
    mode tcp

    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

    default_backend envoy_tcp_backend


# ============================================================
# HTTP BACKEND
# ============================================================

backend envoy_http_backend
    mode http

    timeout connect 10s
    timeout server 3600s
    timeout tunnel 3600s

    server envoy_main 127.0.0.1:8080 check inter 2s rise 2 fall 3


# ============================================================
# TCP / gRPC BACKEND
# ============================================================

backend envoy_tcp_backend
    mode tcp

    timeout connect 10s
    timeout server 3600s
    timeout tunnel 3600s

    server envoy_main 127.0.0.1:8080 check inter 2s rise 2 fall 3
