global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy

defaults
    log global
    mode http
    option httplog
    option dontlognull

    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 1h
    timeout http-request 15s
    timeout queue 30s
    timeout http-keep-alive 300s


# ============================================================
# HTTP / WS / XHTTP
# Envoy :8080 → HAProxy :8081 → OpenResty :8082
# ============================================================

frontend virgozki_http
    bind 127.0.0.1:8081

    # Security filters
    http-request deny if { path_beg /../ }
    http-request deny if { path_beg /etc/ }
    http-request deny if { path_beg /proc/ }
    http-request deny if { path_beg /sys/ }

    # Forward headers
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Forwarded-For %[src]

    default_backend openresty_http


backend openresty_http
    server openresty 127.0.0.1:8082 check inter 2000 rise 2 fall 3
    option http-keep-alive
    http-request set-header Connection ""


# ============================================================
# gRPC (FIXED: GUMAGANA NA NG TAMA)
# Envoy :8080 → HAProxy :8084 → OpenResty :8085
# ============================================================

frontend virgozki_grpc
    bind 127.0.0.1:8084 proto h2

    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-For %[src]

    default_backend openresty_grpc


backend openresty_grpc
    mode http
    http2-request-preface on
    server openresty-grpc 127.0.0.1:8085 check inter 2000 rise 2 fall 3


# ============================================================
# LOCAL MONITORING STATS (INTERNAL ONLY)
# ============================================================

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats hide-version
    stats auth virgozki:change-this-password
