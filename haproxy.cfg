global
    log stdout format raw local0
    maxconn 10000

defaults
    mode http
    log global

    option httplog
    option dontlognull
    option http-server-close
    option forwardfor

    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s
    timeout http-request 15s
    timeout http-keep-alive 30s

# ============================================================
# HTTP / WS / HTTPUPGRADE / XHTTP
# ============================================================

frontend http_front
    bind 127.0.0.1:8081

    # Basic host validation
    http-request deny deny_status 400 if !{ req.hdr(host) -m found }

    # --------------------------------------------------------
    # TROJAN
    # --------------------------------------------------------

    use_backend trojan_ws if { path -i /virgozki }
    use_backend trojan_hu if { path -i /virgozki-hu }
    use_backend trojan_xhttp if { path -i /virgozki-xhttp }

    # --------------------------------------------------------
    # VMESS
    # --------------------------------------------------------

    use_backend vmess_ws if { path -i /vmess-virgozki }
    use_backend vmess_hu if { path -i /vmess-virgozki-hu }
    use_backend vmess_xhttp if { path -i /vmess-virgozki-xhttp }

    # --------------------------------------------------------
    # VLESS
    # --------------------------------------------------------

    use_backend vless_ws if { path -i /vless-virgozki }
    use_backend vless_hu if { path -i /vless-virgozki-hu }
    use_backend vless_xhttp if { path -i /vless-virgozki-xhttp }

    # --------------------------------------------------------
    # SHADOWSOCKS
    # --------------------------------------------------------

    use_backend ss_ws if { path -i /ss-virgozki }
    use_backend ss_hu if { path -i /ss-virgozki-hu }
    use_backend ss_xhttp if { path -i /ss-virgozki-xhttp }

    # Normal web
    default_backend envoy_web

# ============================================================
# TROJAN
# ============================================================

backend trojan_ws
    option http-server-close
    timeout tunnel 3600s

    server xray 127.0.0.1:10000 check

backend trojan_hu
    option http-server-close
    timeout tunnel 3600s

    server xray 127.0.0.1:10001 check

backend trojan_xhttp
    server xray 127.0.0.1:10002 check

# ============================================================
# VMESS
# ============================================================

backend vmess_ws
    option http-server-close
    timeout tunnel 3600s

    server xray 127.0.0.1:10003 check

backend vmess_hu
    option http-server-close
    timeout tunnel 3600s

    server xray 127.0.0.1:10004 check

backend vmess_xhttp
    server xray 127.0.0.1:10005 check

# ============================================================
# VLESS
# ============================================================

backend vless_ws
    option http-server-close
    timeout tunnel 3600s

    server xray 127.0.0.1:10006 check

backend vless_hu
    option http-server-close
    timeout tunnel 3600s

    server xray 127.0.0.1:10007 check

backend vless_xhttp
    server xray 127.0.0.1:10008 check

# ============================================================
# SHADOWSOCKS
# ============================================================

backend ss_ws
    option http-server-close
    timeout tunnel 3600s

    server xray 127.0.0.1:10009 check

backend ss_hu
    option http-server-close
    timeout tunnel 3600s

    server xray 127.0.0.1:10010 check

backend ss_xhttp
    server xray 127.0.0.1:10011 check

# ============================================================
# NORMAL WEB → ENVOY
# ============================================================

backend envoy_web
    option httpchk GET /health
    http-check expect status 200

    server envoy 127.0.0.1:8082 check

# ============================================================
# gRPC TCP PASSTHROUGH
#
# Nginx strips /proxy/haproxy/ before sending the HTTP/2 stream
# to this listener.
# ============================================================

frontend grpc_front
    bind 127.0.0.1:8084

    mode tcp

    option tcplog

    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

    use_backend vless_grpc_tcp if { req.payload(0,0),lower -m found }
    default_backend grpc_router

backend grpc_router
    mode tcp

    # Default gRPC destination.
    # The public gRPC paths are validated/selected by Nginx.
    server vless 127.0.0.1:10012 check

backend vless_grpc_tcp
    mode tcp

    server vless 127.0.0.1:10012 check
