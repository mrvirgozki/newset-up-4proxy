global
    log stdout format raw local0

    maxconn 4096

    user haproxy
    group haproxy

    stats socket /run/haproxy/admin.sock mode 660 level admin


defaults
    log global

    mode http

    option httplog
    option dontlognull
    option http-keep-alive
    option forwardfor

    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 1h
    timeout http-request 15s
    timeout queue 30s
    timeout http-keep-alive 300s


# ============================================================
# HTTP / WEBSOCKET / HTTPUPGRADE / XHTTP
#
# Envoy :$PORT
#       ↓
# HAProxy :8081
#       ↓
# OpenResty :8082
#       ↓
# Apache :8083
# ============================================================

frontend virgozki_http

    bind 127.0.0.1:8081

    # --------------------------------------------------------
    # Basic path filtering
    # --------------------------------------------------------

    http-request deny if { path_beg /../ }
    http-request deny if { path_beg /etc/ }
    http-request deny if { path_beg /proc/ }
    http-request deny if { path_beg /sys/ }

    # --------------------------------------------------------
    # Forward headers
    # --------------------------------------------------------

    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8080

    default_backend openresty_http


backend openresty_http

    mode http

    option http-keep-alive

    http-request set-header Connection ""

    server openresty \
        127.0.0.1:8082 \
        check \
        inter 2000ms \
        rise 2 \
        fall 3


# ============================================================
# gRPC
#
# Envoy :$PORT
#       ↓
# HAProxy :8084
#       ↓
# OpenResty :8085
#       ↓
# Apache :8083
#       ↓
# Xray
# ============================================================

frontend virgozki_grpc

    bind 127.0.0.1:8084 proto h2

    option http-keep-alive

    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8080

    default_backend openresty_grpc


backend openresty_grpc

    mode http

    option http-keep-alive

    http2-request-preface on

    server openresty-grpc \
        127.0.0.1:8085 \
        proto h2 \
        check \
        inter 2000ms \
        rise 2 \
        fall 3


# ============================================================
# INTERNAL STATS
# ============================================================

listen stats

    bind 127.0.0.1:8404

    mode http

    stats enable

    stats uri /stats

    stats refresh 10s

    stats hide-version

    stats auth virgozki:change-this-password
