global
    log stdout format raw local0
    maxconn 4096

defaults
    log global

    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 1h
    timeout http-request 15s
    timeout queue 30s


# ============================================================
# HTTP
# Envoy :8080
#     ↓
# HAProxy :8081
#     ↓
# OpenResty :8082
# ============================================================

frontend virgozki_http
    bind 127.0.0.1:8081
    mode http

    option httplog
    option http-keep-alive

    # Basic path filtering
    http-request deny if { path_beg /../ }
    http-request deny if { path_beg /etc/ }
    http-request deny if { path_beg /proc/ }
    http-request deny if { path_beg /sys/ }

    # Forwarding headers
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8080

    default_backend openresty_http


backend openresty_http
    mode http

    option http-keep-alive

    server openresty \
        127.0.0.1:8082 \
        check


# ============================================================
# gRPC
# Envoy :8080
#     ↓
# HAProxy :8084
#     ↓
# OpenResty :8085
# ============================================================

frontend virgozki_grpc
    bind 127.0.0.1:8084
    mode tcp

    option tcplog

    default_backend openresty_grpc


backend openresty_grpc
    mode tcp

    option tcp-check

    server openresty-grpc \
        127.0.0.1:8085 \
        check


# ============================================================
# LOCAL STATS
# ============================================================

listen stats
    bind 127.0.0.1:8404
    mode http

    stats enable
    stats uri /stats
    stats refresh 10s
    stats hide-version

    # CHANGE THIS PASSWORD
    stats auth virgozki:change-this-password
