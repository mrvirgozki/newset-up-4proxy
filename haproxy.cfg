# ============================================================
# HAPROXY.CFG - FINAL VERSION (TUGMA SA ENVOY / DOCKERFILE)
# ============================================================

global
    log stdout format raw local0
    maxconn 10000
    user root
    group root

defaults
    log global
    option dontlognull
    option httplog
    option http-server-close
    option forwardfor

    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s
    timeout http-request 15s
    timeout http-keep-alive 30s


# ============================================================
# FRONTEND 1: HTTP / WS / XHTTP (INTERNAL USE)
# DUMIDIRETSO NA KAY ENVOY — SIYA NA ANG MAGR-RUTE
# ============================================================
frontend http_front
    bind 127.0.0.1:8081
    mode http

    http-request deny deny_status 400 if !{ req.hdr(host) -m found }

    default_backend envoy_http_backend


# ============================================================
# FRONTEND 2: TCP / gRPC (INTERNAL USE)
# ============================================================
frontend grpc_front
    bind 127.0.0.1:8084
    mode tcp

    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

    default_backend envoy_tcp_backend


# ============================================================
# BACKENDS — TAMA NA ANG PORT: 8080 (HINDI 8082!)
# ============================================================
backend envoy_http_backend
    mode http
    timeout tunnel 3600s
    server envoy_main 127.0.0.1:8080 check inter 2s rise 2 fall 3

backend envoy_tcp_backend
    mode tcp
    timeout connect 10s
    timeout tunnel 3600s
    server envoy_main 127.0.0.1:8080 check inter 2s rise 2 fall 3
