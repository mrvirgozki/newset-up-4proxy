global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    option forwardfor
    option http-reuse always

    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 86400s
    timeout http-request 15s
    timeout http-keep-alive 300s

# ============================================================
# HTTP / WS / XHTTP + PANEL
# ============================================================
frontend virgozki_http
    bind 127.0.0.1:8081

    http-request deny if { path_beg /../ }
    http-request deny if { path_beg /etc/ }
    http-request deny if { path_beg /proc/ }
    http-request deny if { path_beg /sys/ }

    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8080

    # ✅ SIGURADUHIN: LAHAT NG PATH KASAMA ANG PANEL / AY PUPUNTA
    default_backend openresty_http

backend openresty_http
    mode http
    option http-keep-alive
    # ✅ CUSTOM HEALTH CHECK — HINDI NA MAGKAKA-MALI NG DETEKSYON
    option httpchk GET /
    http-check expect status 200
    server openresty-http 127.0.0.1:8082 check inter 2000ms rise 2 fall 3

# ============================================================
# gRPC
# ============================================================
frontend virgozki_grpc
    bind 127.0.0.1:8084 proto h2
    mode http
    option http-keep-alive

    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8080

    default_backend openresty_grpc

backend openresty_grpc
    mode http
    option http-keep-alive
    # ✅ Dagdag check para sa gRPC din
    option httpchk GET /
    http-check expect status 200
    server openresty-grpc 127.0.0.1:8085 check inter 2000ms rise 2 fall 3

# ============================================================
# Internal Stats
# ============================================================
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats hide-version
    stats auth virgozki:change-this-password
