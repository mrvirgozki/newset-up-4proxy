static_resources:

  # ============================================================
  # LISTENER
  # Cloud Run -> Envoy :8080
  # ============================================================

  listeners:

    - name: main_listener

      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080

      per_connection_buffer_limit_bytes: 1048576

      filter_chains:

        - filters:

            - name: envoy.filters.network.http_connection_manager

              typed_config:

                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                stat_prefix: virgozki_http

                codec_type: AUTO

                # ==================================================
                # TIMEOUTS
                # Keep these directly under HttpConnectionManager.
                # ==================================================

                request_timeout: 0s
                stream_idle_timeout: 3600s
                request_headers_timeout: 30s

                # ==================================================
                # PATH HANDLING
                # ==================================================

                normalize_path: true
                merge_slashes: true

                # ==================================================
                # ACCESS LOG
                # ==================================================

                access_log:

                  - name: envoy.access_loggers.stdout

                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                # ==================================================
                # WEBSOCKET / HTTP UPGRADE
                # ==================================================

                upgrade_configs:

                  - upgrade_type: websocket

                  - upgrade_type: httpupgrade

                # ==================================================
                # ROUTES
                # ==================================================

                route_config:

                  name: virgozki_routes

                  virtual_hosts:

                    - name: local_service

                      domains:
                        - "*"

                      routes:

                        # ==================================================
                        # HEALTH
                        # GET /health -> 200
                        # ==================================================

                        - match:
                            path: /health

                          direct_response:
                            status: 200

                            body:
                              inline_string: "ok\n"


                        # ==================================================
                        # VLESS gRPC
                        # :10012
                        # ==================================================

                        - match:
                            prefix: /vless-grpc-virgozki/

                          route:
                            cluster: vless_grpc
                            timeout: 0s


                        # ==================================================
                        # VMESS gRPC
                        # :10013
                        # ==================================================

                        - match:
                            prefix: /vmess-grpc-virgozki/

                          route:
                            cluster: vmess_grpc
                            timeout: 0s


                        # ==================================================
                        # TROJAN gRPC
                        # :10014
                        # ==================================================

                        - match:
                            prefix: /trojan-grpc-virgozki/

                          route:
                            cluster: trojan_grpc
                            timeout: 0s


                        # ==================================================
                        # SHADOWSOCKS gRPC
                        # :10015
                        # ==================================================

                        - match:
                            prefix: /ss-grpc-virgozki/

                          route:
                            cluster: ss_grpc
                            timeout: 0s


                        # ==================================================
                        # TROJAN XHTTP
                        # :10002
                        #
                        # MUST COME BEFORE /virgozki
                        # ==================================================

                        - match:
                            prefix: /virgozki-xhttp

                          route:
                            cluster: trojan_xhttp
                            timeout: 0s


                        # ==================================================
                        # TROJAN HTTPUPGRADE
                        # :10001
                        #
                        # MUST COME BEFORE /virgozki
                        # ==================================================

                        - match:
                            prefix: /virgozki-hu

                          route:
                            cluster: trojan_hu
                            timeout: 0s


                        # ==================================================
                        # TROJAN WS
                        # :10000
                        # ==================================================

                        - match:
                            prefix: /virgozki

                          route:
                            cluster: trojan_ws
                            timeout: 0s


                        # ==================================================
                        # VMESS XHTTP
                        # :10005
                        #
                        # MUST COME BEFORE /vmess-virgozki
                        # ==================================================

                        - match:
                            prefix: /vmess-virgozki-xhttp

                          route:
                            cluster: vmess_xhttp
                            timeout: 0s


                        # ==================================================
                        # VMESS HTTPUPGRADE
                        # :10004
                        # ==================================================

                        - match:
                            prefix: /vmess-virgozki-hu

                          route:
                            cluster: vmess_hu
                            timeout: 0s


                        # ==================================================
                        # VMESS WS
                        # :10003
                        # ==================================================

                        - match:
                            prefix: /vmess-virgozki

                          route:
                            cluster: vmess_ws
                            timeout: 0s


                        # ==================================================
                        # VLESS XHTTP
                        # :10008
                        #
                        # MUST COME BEFORE /vless-virgozki
                        # ==================================================

                        - match:
                            prefix: /vless-virgozki-xhttp

                          route:
                            cluster: vless_xhttp
                            timeout: 0s


                        # ==================================================
                        # VLESS HTTPUPGRADE
                        # :10007
                        # ==================================================

                        - match:
                            prefix: /vless-virgozki-hu

                          route:
                            cluster: vless_hu
                            timeout: 0s


                        # ==================================================
                        # VLESS WS
                        # :10006
                        # ==================================================

                        - match:
                            prefix: /vless-virgozki

                          route:
                            cluster: vless_ws
                            timeout: 0s


                        # ==================================================
                        # SHADOWSOCKS XHTTP
                        # :10011
                        #
                        # MUST COME BEFORE /ss-virgozki
                        # ==================================================

                        - match:
                            prefix: /ss-virgozki-xhttp

                          route:
                            cluster: ss_xhttp
                            timeout: 0s


                        # ==================================================
                        # SHADOWSOCKS HTTPUPGRADE
                        # :10010
                        # ==================================================

                        - match:
                            prefix: /ss-virgozki-hu

                          route:
                            cluster: ss_hu
                            timeout: 0s


                        # ==================================================
                        # SHADOWSOCKS WS
                        # :10009
                        # ==================================================

                        - match:
                            prefix: /ss-virgozki

                          route:
                            cluster: ss_ws
                            timeout: 0s


                        # ==================================================
                        # DEFAULT -> APACHE PANEL
                        # ==================================================

                        - match:
                            prefix: /

                          route:
                            cluster: apache_web
                            timeout: 60s


                # ==================================================
                # HTTP ROUTER
                # ==================================================

                http_filters:

                  - name: envoy.filters.http.router

                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router


  # ============================================================
  # CLUSTERS
  # ============================================================

  clusters:

    # ==========================================================
    # TROJAN WS :10000
    # ==========================================================

    - name: trojan_ws

      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN

      load_assignment:

        cluster_name: trojan_ws

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10000


    # ==========================================================
    # TROJAN HTTPUPGRADE :10001
    # ==========================================================

    - name: trojan_hu

      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN

