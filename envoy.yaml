static_resources:

# ============================================================
# LISTENER
# Cloud Run -> Envoy :8080
# ============================================================
  listeners:
  - name: main_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    per_connection_buffer_limit_bytes: 1048576
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: virgozki_http
          codec_type: AUTO

          # HTTP/2 DOWNSTREAM PROTOCOL OPTIONS (FOR XHTTP & gRPC)
          http2_protocol_options:
            max_concurrent_streams: 1024
            allow_connect: true

          # TIMEOUTS
          request_timeout: 0s
          stream_idle_timeout: 3600s
          request_headers_timeout: 30s

          # PATH HANDLING
          normalize_path: true
          merge_slashes: true

          # ACCESS LOG
          access_log:
            - name: envoy.access_loggers.stdout
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

          # WEBSOCKET / HTTP UPGRADE
          upgrade_configs:
            - upgrade_type: websocket
            - upgrade_type: httpupgrade

          # ROUTES
          route_config:
            name: virgozki_routes
            virtual_hosts:
              - name: local_service
                domains: ["*"]
                routes:
                  # HEALTH
                  - match:
                      path: /health
                    direct_response:
                      status: 200
                      body:
                        inline_string: "ok\n"

                  # gRPC
                  - match:
                      prefix: /vless-grpc-virgozki
                    route:
                      cluster: vless_grpc
                      timeout: 0s

                  - match:
                      prefix: /vmess-grpc-virgozki
                    route:
                      cluster: vmess_grpc
                      timeout: 0s

                  - match:
                      prefix: /trojan-grpc-virgozki
                    route:
                      cluster: trojan_grpc
                      timeout: 0s

                  - match:
                      prefix: /ss-grpc-virgozki
                    route:
                      cluster: ss_grpc
                      timeout: 0s

                  # TROJAN
                  - match:
                      prefix: /virgozki-xhttp
                    route:
                      cluster: trojan_xhttp
                      timeout: 0s

                  - match:
                      prefix: /virgozki-hu
                    route:
                      cluster: trojan_hu
                      timeout: 0s

                  - match:
                      prefix: /virgozki
                    route:
                      cluster: trojan_ws
                      timeout: 0s

                  # VMESS
                  - match:
                      prefix: /vmess-virgozki-xhttp
                    route:
                      cluster: vmess_xhttp
                      timeout: 0s

                  - match:
                      prefix: /vmess-virgozki-hu
                    route:
                      cluster: vmess_hu
                      timeout: 0s

                  - match:
                      prefix: /vmess-virgozki
                    route:
                      cluster: vmess_ws
                      timeout: 0s

                  # VLESS
                  - match:
                      prefix: /vless-virgozki-xhttp
                    route:
                      cluster: vless_xhttp
                      timeout: 0s

                  - match:
                      prefix: /vless-virgozki-hu
                    route:
                      cluster: vless_hu
                      timeout: 0s

                  - match:
                      prefix: /vless-virgozki
                    route:
                      cluster: vless_ws
                      timeout: 0s

                  # SHADOWSOCKS
                  - match:
                      prefix: /ss-virgozki-xhttp
                    route:
                      cluster: ss_xhttp
                      timeout: 0s

                  - match:
                      prefix: /ss-virgozki-hu
                    route:
                      cluster: ss_hu
                      timeout: 0s

                  - match:
                      prefix: /ss-virgozki
                    route:
                      cluster: ss_ws
                      timeout: 0s

                  # DEFAULT / PANEL
                  - match:
                      prefix: /
                    route:
                      cluster: apache_web
                      timeout: 60s

          # HTTP ROUTER
          http_filters:
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

# ============================================================
# CLUSTERS
# ============================================================
  clusters:

  # TROJAN
  - name: trojan_ws
    connect_timeout: 5s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: trojan_ws
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 10000

  - name: trojan_hu
