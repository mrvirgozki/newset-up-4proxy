# ============================================================
# VIRGOZKI 4-PROXY + gRPC + XHTTP
# ENVOY | CLOUD RUN
#
# PUBLIC:
#   Cloud Run -> Envoy :8080
#
# INTERNAL:
#   Xray:
#     WS            :10000-10011
#     gRPC          :10012-10015
#
#   Apache         :8083
#
# HEALTH:
#   http://127.0.0.1:8080/health
#
# ADMIN:
#   http://127.0.0.1:9901/ready
# ============================================================

static_resources:

  # ==========================================================
  # LISTENER
  # Cloud Run -> Envoy :8080
  # ==========================================================
  listeners:

    - name: virgozki_listener

      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080

      per_connection_buffer_limit_bytes: 1048576

      filter_chains:

        - filters:

            - name: envoy.filters.network.http_connection_manager

              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                stat_prefix: virgozki_http

                codec_type: AUTO

                # ==================================================
                # TIMEOUTS
                # ==================================================

                request_timeout: 0s
                stream_idle_timeout: 3600s

                # ==================================================
                # PATH HANDLING
                # ==================================================

                normalize_path: true
                merge_slashes: true

                # ==================================================
                # ACCESS LOG
                # ==================================================

                access_log:

                  - name: envoy.access_loggers.stdout

                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                # ==================================================
                # WEBSOCKET / HTTP UPGRADE
                # ==================================================

                upgrade_configs:

                  - upgrade_type: websocket

                  - upgrade_type: httpupgrade

                # ==================================================
                # HTTP FILTERS
                # ==================================================

                http_filters:

                  - name: envoy.filters.http.router

                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                # ==================================================
                # ROUTING
                # ==================================================

                route_config:

                  name: virgozki_routes

                  virtual_hosts:

                    - name: virgozki

                      domains:
                        - "*"

                      routes:

                        # ==================================================
                        # HEALTH
                        # IMPORTANT:
                        # Cloud Run / local health checker can use:
                        # /health
                        # ==================================================

                        - match:
                            path: /health

                          direct_response:
                            status: 200

                            body:
                              inline_string: "ok\n"


                        # ==================================================
                        # READY
                        # Public listener copy of readiness endpoint
                        # ==================================================

                        - match:
                            path: /ready

                          direct_response:
                            status: 200

                            body:
                              inline_string: "ready\n"


                        # ==================================================
                        # VLESS gRPC
                        # Xray :10012
                        # serviceName:
                        # vless-grpc-virgozki
                        # ==================================================

                        - match:
                            prefix: /vless-grpc-virgozki/

                          route:
                            cluster: vless_grpc
                            timeout: 0s


                        # ==================================================
                        # VMESS gRPC
                        # Xray :10013
                        # ==================================================

                        - match:
                            prefix: /vmess-grpc-virgozki/

                          route:
                            cluster: vmess_grpc
                            timeout: 0s


                        # ==================================================
                        # TROJAN gRPC
                        # Xray :10014
                        # ==================================================

                        - match:
                            prefix: /trojan-grpc-virgozki/

                          route:
                            cluster: trojan_grpc
                            timeout: 0s


                        # ==================================================
                        # SHADOWSOCKS gRPC
                        # Xray :10015
                        # ==================================================

                        - match:
                            prefix: /ss-grpc-virgozki/

                          route:
                            cluster: ss_grpc
                            timeout: 0s


                        # ==================================================
                        # TROJAN XHTTP
                        # Xray :10002
                        #
                        # config.json:
                        # /virgozki-xhttp
                        # ==================================================

                        - match:
                            prefix: /virgozki-xhttp

                          route:
                            cluster: trojan_xhttp
                            timeout: 0s


                        # ==================================================
                        # VMESS XHTTP
                        # Xray :10005
                        # ==================================================

                        - match:
                            prefix: /vmess-virgozki-xhttp

                          route:
                            cluster: vmess_xhttp
                            timeout: 0s


                        # ==================================================
                        # VLESS XHTTP
                        # Xray :10008
                        # ==================================================

                        - match:
                            prefix: /vless-virgozki-xhttp

                          route:
                            cluster: vless_xhttp
                            timeout: 0s


                        # ==================================================
                        # SHADOWSOCKS XHTTP
                        # Xray :10011
                        # ==================================================

                        - match:
                            prefix: /ss-virgozki-xhttp

                          route:
                            cluster: ss_xhttp
                            timeout: 0s


                        # ==================================================
                        # TROJAN WS
                        # Xray :10000
                        #
                        # config.json:
                        # /virgozki
                        # ==================================================

                        - match:
                            path: /virgozki

                          route:
                            cluster: trojan_ws
                            timeout: 0s


                        # ==================================================
                        # TROJAN HTTPUPGRADE
                        # Xray :10001
                        #
                        # config.json:
                        # /virgozki-hu
                        # ==================================================

                        - match:
                            path: /virgozki-hu

                          route:
                            cluster: trojan_httpupgrade
                            timeout: 0s


                        # ==================================================
                        # VMESS WS
                        # Xray :10003
                        # ==================================================

                        - match:
                            path: /vmess-virgozki

                          route:
                            cluster: vmess_ws
                            timeout: 0s


                        # ==================================================
                        # VMESS HTTPUPGRADE
                        # Xray :10004
                        # ==================================================

                        - match:
                            path: /vmess-virgozki-hu

                          route:
                            cluster: vmess_httpupgrade
                            timeout: 0s


                        # ==================================================
                        # VLESS WS
                        # Xray :10006
                        # ==================================================

                        - match:
                            path: /vless-virgozki

                          route:
                            cluster: vless_ws
                            timeout: 0s


                        # ==================================================
                        # VLESS HTTPUPGRADE
                        # Xray :10007
                        # ==================================================

                        - match:
                            path: /vless-virgozki-hu

                          route:
                            cluster: vless_httpupgrade
                            timeout: 0s


                        # ==================================================
                        # SHADOWSOCKS WS
                        # Xray :10009
                        # ==================================================

                        - match:
                            path: /ss-virgozki

                          route:
                            cluster: ss_ws
                            timeout: 0s


                        # ==================================================
                        # SHADOWSOCKS HTTPUPGRADE
                        # Xray :10010
                        # ==================================================

                        - match:
                            path: /ss-virgozki-hu

                          route:
                            cluster: ss_httpupgrade
                            timeout: 0s


                        # ==================================================
                        # DEFAULT
                        # Apache panel :8083
                        # ==================================================

                        - match:
                            prefix: /

                          route:
                            cluster: apache_web
                            timeout: 60s


  # ============================================================
  # CLUSTERS
  # ============================================================

  clusters:


    # ==========================================================
    # TROJAN WS :10000
    # ==========================================================

    - name: trojan_ws

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: trojan_ws

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10000


    # ==========================================================
    # TROJAN HTTPUPGRADE :10001
    # ==========================================================

    - name: trojan_httpupgrade

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: trojan_httpupgrade

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10001


    # ==========================================================
    # TROJAN XHTTP :10002
    # ==========================================================

    - name: trojan_xhttp

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: trojan_xhttp

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10002


    # ==========================================================
    # VMESS WS :10003
    # ==========================================================

    - name: vmess_ws

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: vmess_ws

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10003


    # ==========================================================
    # VMESS HTTPUPGRADE :10004
    # ==========================================================

    - name: vmess_httpupgrade

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: vmess_httpupgrade

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10004


    # ==========================================================
    # VMESS XHTTP :10005
    # ==========================================================

    - name: vmess_xhttp

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: vmess_xhttp

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10005


    # ==========================================================
    # VLESS WS :10006
    # ==========================================================

    - name: vless_ws

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: vless_ws

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10006


    # ==========================================================
    # VLESS HTTPUPGRADE :10007
    # ==========================================================

    - name: vless_httpupgrade

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: vless_httpupgrade

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10007


    # ==========================================================
    # VLESS XHTTP :10008
    # ==========================================================

    - name: vless_xhttp

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: vless_xhttp

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10008


    # ==========================================================
    # SHADOWSOCKS WS :10009
    # ==========================================================

    - name: ss_ws

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: ss_ws

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10009


    # ==========================================================
    # SHADOWSOCKS HTTPUPGRADE :10010
    # ==========================================================

    - name: ss_httpupgrade

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: ss_httpupgrade

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10010


    # ==========================================================
    # SHADOWSOCKS XHTTP :10011
    # ==========================================================

    - name: ss_xhttp

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: ss_xhttp

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10011


    # ==========================================================
    # VLESS gRPC :10012
    # ==========================================================

    - name: vless_grpc

      connect_timeout: 5s
      type: STATIC

      http2_protocol_options: {}

      load_assignment:

        cluster_name: vless_grpc

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10012


    # ==========================================================
    # VMESS gRPC :10013
    # ==========================================================

    - name: vmess_grpc

      connect_timeout: 5s
      type: STATIC

      http2_protocol_options: {}

      load_assignment:

        cluster_name: vmess_grpc

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10013


    # ==========================================================
    # TROJAN gRPC :10014
    # ==========================================================

    - name: trojan_grpc

      connect_timeout: 5s
      type: STATIC

      http2_protocol_options: {}

      load_assignment:

        cluster_name: trojan_grpc

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 10014


    # ==========================================================
    # SHADOWSOCKS gRPC :10015
    # ==========================================================

    - name: ss_grpc

      connect_timeout: 5s
      type: STATIC

      http2_protocol_options: {}

      load_assignment:

        cluster_name: ss_grpc

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address: 127.0.0.1
                  port_value: 10015


    # ==========================================================
    # APACHE PANEL :8083
    # ==========================================================

    - name: apache_web

      connect_timeout: 5s
      type: STATIC

      load_assignment:

        cluster_name: apache_web

        endpoints:

          - lb_endpoints:

              - endpoint:

                  address:

                    socket_address:
                      address: 127.0.0.1
                      port_value: 8083


# ============================================================
# ADMIN
# ============================================================

admin:

  access_log_path: /dev/stderr

  address:

    socket_address:
      address: 127.0.0.1
      port_value: 9901

  # Admin readiness endpoint:
  # http://127.0.0.1:9901/ready

  allow_paths:

    - exact: /ready
