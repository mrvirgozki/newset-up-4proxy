static_resources:

  listeners:
  - name: main_listener

    address:
      socket_address:
        address: 127.0.0.1
        port_value: 8082

    filter_chains:
    - filters:

      - name: envoy.filters.network.http_connection_manager

        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

          stat_prefix: virgozki_http

          codec_type: AUTO

          common_http_protocol_options:
            idle_timeout: 3600s

          stream_idle_timeout: 3600s

          request_timeout: 0s

          normalize_path: true
          merge_slashes: true

          request_headers_to_add:
          - header:
              key: x-forwarded-proto
              value: https
            append_action: OVERWRITE_IF_EXISTS_OR_ADD

          upgrade_configs:
          - upgrade_type: websocket

          - upgrade_type: httpupgrade

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          route_config:

            name: virgozki_routes

            virtual_hosts:

            - name: local_service

              domains:
              - "*"

              routes:

              # =================================================
              # HEALTH
              # =================================================

              - match:
                  path: /health

                direct_response:
                  status: 200

                  body:
                    inline_string: "ok\n"


              # =================================================
              # gRPC
              #
              # /serviceName/method
              #
              # Envoy -> Xray gRPC :10012-10015
              # =================================================

              - match:
                  prefix: /vless-grpc-virgozki/

                route:
                  cluster: vless_grpc
                  timeout: 0s


              - match:
                  prefix: /vmess-grpc-virgozki/

                route:
                  cluster: vmess_grpc
                  timeout: 0s


              - match:
                  prefix: /trojan-grpc-virgozki/

                route:
                  cluster: trojan_grpc
                  timeout: 0s


              - match:
                  prefix: /ss-grpc-virgozki/

                route:
                  cluster: ss_grpc
                  timeout: 0s


              # =================================================
              # TROJAN
              # =================================================

              - match:
                  path: /virgozki

                route:
                  cluster: trojan_ws
                  timeout: 0s


              - match:
                  path: /virgozki-hu

                route:
                  cluster: trojan_hu
                  timeout: 0s


              - match:
                  path: /virgozki-xhttp

                route:
                  cluster: trojan_xhttp
                  timeout: 0s


              # =================================================
              # VMESS
              # =================================================

              - match:
                  path: /vmess-virgozki

                route:
                  cluster: vmess_ws
                  timeout: 0s


              - match:
                  path: /vmess-virgozki-hu

                route:
                  cluster: vmess_hu
                  timeout: 0s


              - match:
                  path: /vmess-virgozki-xhttp

                route:
                  cluster: vmess_xhttp
                  timeout: 0s


              # =================================================
              # VLESS
              # =================================================

              - match:
                  path: /vless-virgozki

                route:
                  cluster: vless_ws
                  timeout: 0s


              - match:
                  path: /vless-virgozki-hu

                route:
                  cluster: vless_hu
                  timeout: 0s


              - match:
                  path: /vless-virgozki-xhttp

                route:
                  cluster: vless_xhttp
                  timeout: 0s


              # =================================================
              # SHADOWSOCKS
              # =================================================

              - match:
                  path: /ss-virgozki

                route:
                  cluster: ss_ws
                  timeout: 0s


              - match:
                  path: /ss-virgozki-hu

                route:
                  cluster: ss_hu
                  timeout: 0s


              - match:
                  path: /ss-virgozki-xhttp

                route:
                  cluster: ss_xhttp
                  timeout: 0s


              # =================================================
              # NORMAL WEBSITE
              # =================================================

              - match:
                  prefix: /

                route:
                  cluster: apache_web
                  timeout: 60s


  # ============================================================
  # CLUSTERS
  # ============================================================

  clusters:

  # ============================================================
  # TROJAN
  # ============================================================

  - name: trojan_ws
    connect_timeout: 5s
    type: STATIC
    lb_policy: ROUND_ROBIN

    load_assignment:
      cluster_name: trojan_ws

      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10000


  - name: trojan_hu
    connect_timeout: 5s
    type: STATIC
    lb_policy: ROUND_ROBIN

    load_assignment:
      cluster_name: trojan_hu

      endpoints:
