static_resources:
  listeners:
  - name: main_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080

    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

          stat_prefix: virgozki_http
          codec_type: AUTO

          common_http_protocol_options:
            idle_timeout: 3600s

          stream_idle_timeout: 3600s
          request_timeout: 0s

          normalize_path: true
          merge_slashes: true

          upgrade_configs:
          - upgrade_type: websocket
          - upgrade_type: httpupgrade

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          route_config:
            name: virgozki_routes

            virtual_hosts:
            - name: local_service

              domains:
              - "*"

              request_headers_to_add:
              - header:
                  key: x-forwarded-proto
                  value: https
                append_action: OVERWRITE_IF_EXISTS_OR_ADD

              routes:

              # ==================================================
              # HEALTH
              # ==================================================

              - match:
                  path: /health
                direct_response:
                  status: 200
                  body:
                    inline_string: "ok\n"


              # ==================================================
              # gRPC
              # ==================================================

              - match:
                  prefix: /vless-grpc-virgozki/
                route:
                  cluster: vless_grpc
                  timeout: 0s

              - match:
                  prefix: /vmess-grpc-virgozki/
                route:
                  cluster: vmess_grpc
                  timeout: 0s

              - match:
                  prefix: /trojan-grpc-virgozki/
                route:
                  cluster: trojan_grpc
                  timeout: 0s

              - match:
                  prefix: /ss-grpc-virgozki/
                route:
                  cluster: ss_grpc
                  timeout: 0s


              # ==================================================
              # TROJAN WS
              # ==================================================

              - match:
                  path: /virgozki
                route:
                  cluster: trojan_ws
                  timeout: 0s


              # ==================================================
              # TROJAN HTTPUPGRADE
              # ==================================================

              - match:
                  path: /virgozki-hu
                route:
                  cluster: trojan_hu
                  timeout: 0s


              # ==================================================
              # TROJAN XHTTP
              #
              # IMPORTANT:
              # prefix is intentional.
              # XHTTP packet-up may generate requests below
              # the configured base path.
              # ==================================================

              - match:
                  prefix: /virgozki-xhttp
                route:
                  cluster: trojan_xhttp
                  timeout: 0s


              # ==================================================
              # VMESS WS
              # ==================================================

              - match:
                  path: /vmess-virgozki
                route:
                  cluster: vmess_ws
                  timeout: 0s


              # ==================================================
              # VMESS HTTPUPGRADE
              # ==================================================

              - match:
                  path: /vmess-virgozki-hu
                route:
                  cluster: vmess_hu
                  timeout: 0s


              # ==================================================
              # VMESS XHTTP
              # ==================================================

              - match:
                  prefix: /vmess-virgozki-xhttp
                route:
                  cluster: vmess_xhttp
                  timeout: 0s


              # ==================================================
              # VLESS WS
              # ==================================================

              - match:
                  path: /vless-virgozki
                route:
                  cluster: vless_ws
                  timeout: 0s


              # ==================================================
              # VLESS HTTPUPGRADE
              # ==================================================

              - match:
                  path: /vless-virgozki-hu
                route:
                  cluster: vless_hu
                  timeout: 0s


              # ==================================================
              # VLESS XHTTP
              # ==================================================

              - match:
                  prefix: /vless-virgozki-xhttp
                route:
                  cluster: vless_xhttp
                  timeout: 0s


              # ==================================================
              # SHADOWSOCKS WS
              # ==================================================

              - match:
                  path: /ss-virgozki
                route:
                  cluster: ss_ws
                  timeout: 0s


              # ==================================================
              # SHADOWSOCKS HTTPUPGRADE
              # ==================================================

              - match:
                  path: /ss-virgozki-hu
                route:
                  cluster: ss_hu
                  timeout: 0s


              # ==================================================
              # SHADOWSOCKS XHTTP
              # ==================================================

              - match:
                  prefix: /ss-virgozki-xhttp
                route:
                  cluster: ss_xhttp
                  timeout: 0s


              # ==================================================
              # DEFAULT WEBSITE / PANEL
              # ==================================================

              - match:
                  prefix: /
                route:
                  cluster: apache_web
                  timeout: 60s


  # ============================================================
  # CLUSTERS
  # ============================================================

  # ============================================================
  # TROJAN WS
  # ============================================================

  - name: trojan_ws
    connect_timeout: 5s
    type: STATIC
    lb_policy: ROUND_ROBIN

    load_assignment:
      cluster_name: trojan_ws

      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10000


  # ============================================================
