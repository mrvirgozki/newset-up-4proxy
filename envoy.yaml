# ============================================================
# VIRGOZKI 4-PROXY + gRPC + XHTTP
# ENVOY | CLOUD RUN
# ============================================================

static_resources:

  # ==========================================================
  # LISTENER
  # Cloud Run -> Envoy :8080
  # ==========================================================
  listeners:

    - name: virgozki_listener

      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080

      # IMPORTANT:
      # Walang connect_timeout dito.
      # connect_timeout ay para sa CLUSTERS.

      per_connection_buffer_limit_bytes: 1048576

      filter_chains:

        - filters:

            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                stat_prefix: virgozki_http

                codec_type: AUTO

                # ------------------------------------------------
                # TIMEOUTS
                # ------------------------------------------------
                request_timeout: 0s
                stream_idle_timeout: 3600s
                request_headers_timeout: 30s

                # ------------------------------------------------
                # PATH HANDLING
                # ------------------------------------------------
                normalize_path: true
                merge_slashes: true

                # ------------------------------------------------
                # ACCESS LOG
                # ------------------------------------------------
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                # ------------------------------------------------
                # WEBSOCKET / HTTP UPGRADE
                # ------------------------------------------------
                upgrade_configs:

                  - upgrade_type: websocket

                  - upgrade_type: HTTP/1.1

                # ------------------------------------------------
                # ROUTES
                # ------------------------------------------------
                route_config:

                  name: virgozki_routes

                  virtual_hosts:

                    - name: virgozki

                      domains:
                        - "*"

                      routes:

                        # =========================================
                        # VLESS gRPC
                        # =========================================
                        - match:
                            prefix: /vless-grpc-virgozki/
                          route:
                            cluster: vless_grpc
                            timeout: 0s

                        # =========================================
                        # VMESS gRPC
                        # =========================================
                        - match:
                            prefix: /vmess-grpc-virgozki/
                          route:
                            cluster: vmess_grpc
                            timeout: 0s

                        # =========================================
                        # TROJAN gRPC
                        # =========================================
                        - match:
                            prefix: /trojan-grpc-virgozki/
                          route:
                            cluster: trojan_grpc
                            timeout: 0s

                        # =========================================
                        # SHADOWSOCKS gRPC
                        # =========================================
                        - match:
                            prefix: /ss-grpc-virgozki/
                          route:
                            cluster: ss_grpc
                            timeout: 0s

                        # =========================================
                        # TROJAN XHTTP
                        # =========================================
                        - match:
                            prefix: /virgozki-xhttp
                          route:
                            cluster: trojan_xhttp
                            timeout: 0s

                        # =========================================
                        # VMESS XHTTP
                        # =========================================
                        - match:
                            prefix: /vmess-virgozki-xhttp
                          route:
                            cluster: vmess_xhttp
                            timeout: 0s

                        # =========================================
                        # VLESS XHTTP
                        # =========================================
                        - match:
                            prefix: /vless-virgozki-xhttp
                          route:
                            cluster: vless_xhttp
                            timeout: 0s

                        # =========================================
                        # SHADOWSOCKS XHTTP
                        # =========================================
                        - match:
                            prefix: /ss-virgozki-xhttp
                          route:
                            cluster: ss_xhttp
                            timeout: 0s

                        # =========================================
                        # TROJAN WS
                        # =========================================
                        - match:
                            path: /virgozki-trojan-ws
                          route:
                            cluster: trojan_ws
                            timeout: 0s

                        # =========================================
                        # TROJAN HTTPUPGRADE
                        # =========================================
                        - match:
                            path: /virgozki-trojan-httpupgrade
                          route:
                            cluster: trojan_httpupgrade
                            timeout: 0s

                        # =========================================
                        # VMESS WS
                        # =========================================
                        - match:
                            path: /virgozki-vmess-ws
                          route:
                            cluster: vmess_ws
                            timeout: 0s

                        # =========================================
                        # VMESS HTTPUPGRADE
                        # =========================================
                        - match:
                            path: /virgozki-vmess-httpupgrade
                          route:
                            cluster: vmess_httpupgrade
                            timeout: 0s

                        # =========================================
                        # VLESS WS
                        # =========================================
                        - match:
                            path: /virgozki-vless-ws
                          route:
                            cluster: vless_ws
                            timeout: 0s

                        # =========================================
                        # VLESS HTTPUPGRADE
                        # =========================================
                        - match:
                            path: /virgozki-vless-httpupgrade
                          route:
                            cluster: vless_httpupgrade
                            timeout: 0s

                        # =========================================
                        # SHADOWSOCKS WS
                        # =========================================
                        - match:
                            path: /virgozki-ss-ws
                          route:
                            cluster: ss_ws
                            timeout: 0s

                        # =========================================
                        # SHADOWSOCKS HTTPUPGRADE
                        # =========================================
                        - match:
                            path: /virgozki-ss-httpupgrade
                          route:
                            cluster: ss_httpupgrade
                            timeout: 0s

                        # =========================================
                        # DEFAULT -> APACHE PANEL
                        # =========================================
                        - match:
                            prefix: /
                          route:
                            cluster: apache_web
                            timeout: 60s


  # ============================================================
  # CLUSTERS
  # ============================================================
  clusters:

    # ==========================================================
    # TROJAN WS :10000
    # ==========================================================
    - name: trojan_ws
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: trojan_ws
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10000


    # ==========================================================
    # TROJAN HTTPUPGRADE :10001
    # ==========================================================
    - name: trojan_httpupgrade
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: trojan_httpupgrade
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10001


    # ==========================================================
    # TROJAN XHTTP :10002
    # ==========================================================
    - name: trojan_xhttp
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: trojan_xhttp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10002


    # ==========================================================
    # VMESS WS :10003
    # ==========================================================
    - name: vmess_ws
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: vmess_ws
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10003


    # ==========================================================
    # VMESS HTTPUPGRADE :10004
    # ==========================================================
    - name: vmess_httpupgrade
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: vmess_httpupgrade
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10004


    # ==========================================================
    # VMESS XHTTP :10005
    # ==========================================================
    - name: vmess_xhttp
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: vmess_xhttp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10005


    # ==========================================================
    # VLESS WS :10006
    # ==========================================================
    - name: vless_ws
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: vless_ws
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10006


    # ==========================================================
    # VLESS HTTPUPGRADE :10007
    # ==========================================================
    - name: vless_httpupgrade
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: vless_httpupgrade
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10007


    # ==========================================================
    # VLESS XHTTP :10008
    # ==========================================================
    - name: vless_xhttp
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: vless_xhttp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10008


    # ==========================================================
    # SHADOWSOCKS WS :10009
    # ==========================================================
    - name: ss_ws
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: ss_ws
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10009


    # ==========================================================
    # SHADOWSOCKS HTTPUPGRADE :10010
    # ==========================================================
    - name: ss_httpupgrade
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: ss_httpupgrade
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10010


    # ==========================================================
    # SHADOWSOCKS XHTTP :10011
    # ==========================================================
    - name: ss_xhttp
      connect_timeout: 5s
      type: STATIC

      load_assignment:
        cluster_name: ss_xhttp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10011


    # ==========================================================
    # VLESS gRPC :10012
    # ==========================================================
    - name: vless_grpc
      connect_timeout: 5s
      type: STATIC

      http2_protocol_options: {}

      load_assignment:
        cluster_name: vless_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
