static_resources:

  listeners:
    - name: web_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 8082

      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                stat_prefix: web

                codec_type: AUTO

                route_config:
                  name: web_routes

                  virtual_hosts:
                    - name: local_web
                      domains:
                        - "*"

                      routes:
                        - match:
                            prefix: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "ok\n"

                        - match:
                            prefix: "/"
                          route:
                            cluster: apache_backend

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

    - name: apache_backend
      type: STATIC
      connect_timeout: 5s

      load_assignment:
        cluster_name: apache_backend

        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8083

      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2

          http_health_check:
            path: "/health"

      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions

          explicit_http_config:
            http_protocol_options: {}

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
