  # Envoy -> Xray
  # HTTP/2 h2c
  # ============================================================

  - name: vless_grpc
    connect_timeout: 5s
    type: STATIC
    lb_policy: ROUND_ROBIN

    http2_protocol_options: {}

    load_assignment:
