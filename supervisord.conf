[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
logfile_backups=0
pidfile=/tmp/supervisord.pid
loglevel=info
user=root


; ============================================================
; XRAY
; Ports: 10000-10015
; ============================================================

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray/config.json
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; APACHE
; Listen: 127.0.0.1:8083
; ============================================================

[program:apache]
command=/bin/sh -c "mkdir -p /run/apache2 && exec /usr/sbin/apachectl -DFOREGROUND"
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; HAProxy
; HTTP  : 127.0.0.1:8081
; gRPC  : 127.0.0.1:8086
; Envoy : 127.0.0.1:8080
; ============================================================

[program:haproxy]
command=/usr/sbin/haproxy -W -db -f /etc/haproxy/haproxy.cfg
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; OPENRESTY
; Listen: 127.0.0.1:8084
;
; IMPORTANT:
; Explicitly use the custom nginx.conf.
; ============================================================

[program:openresty]
command=/usr/local/openresty/bin/openresty -c /etc/openresty/nginx.conf -g "daemon off;"
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; ENVOY
; Public Cloud Run listener: 0.0.0.0:8080
; ============================================================

[program:envoy]
command=/usr/local/bin/envoy -c /etc/envoy/envoy.yaml
priority=50
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; ANTI-DDOS MONITOR
; Does not bind any network port.
; ============================================================

[program:anti_ddos]
command=/usr/bin/python3 /usr/local/bin/anti_ddos.py
priority=60
autostart=true
autorestart=true
startsecs=1
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
