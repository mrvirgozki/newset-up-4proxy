[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info
user=root

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray/config.json
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/var/log/xray/supervisor.log
stderr_logfile=/var/log/xray/supervisor-error.log
stopasgroup=true
killasgroup=true

[program:apache]
command=/usr/sbin/apachectl -DFOREGROUND
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/tmp/apache-supervisor.log
stderr_logfile=/tmp/apache-supervisor-error.log
stopasgroup=true
killasgroup=true

[program:envoy]
command=/usr/local/bin/envoy -c /etc/envoy/envoy.yaml
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/tmp/envoy-supervisor.log
stderr_logfile=/tmp/envoy-supervisor-error.log
stopasgroup=true
killasgroup=true

[program:haproxy]
command=/usr/sbin/haproxy -W -db -f /etc/haproxy/haproxy.cfg
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/tmp/haproxy-supervisor.log
stderr_logfile=/tmp/haproxy-supervisor-error.log
stopasgroup=true
killasgroup=true

[program:openresty]
command=/usr/local/openresty/bin/openresty -g "daemon off;"
priority=50
autostart=true
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/tmp/openresty-supervisor.log
stderr_logfile=/tmp/openresty-supervisor-error.log
stopasgroup=true
killasgroup=true

[program:anti_ddos]
command=/usr/bin/python3 /usr/local/bin/anti_ddos.py
priority=60
autostart=true
autorestart=true
startsecs=1
startretries=5
stdout_logfile=/tmp/anti-ddos.log
stderr_logfile=/tmp/anti-ddos-error.log
stopasgroup=true
killasgroup=true
