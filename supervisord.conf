[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
logfile_backups=0
pidfile=/tmp/supervisord.pid
loglevel=info
user=root

# ============================================================
# STARTUP ORDER: XRAY → APACHE → HAPROXY → OPENRESTY → ENVOY → ANTI-DDOS
# Envoy ang HULI para ready na lahat bago tumanggap traffic sa 8080
# ============================================================

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray/config.json
priority=10
autostart=true
autorestart=true
startsecs=3  # Dagdag oras para ma-load lahat ng Xray assets
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:apache]
command=/bin/sh -c "mkdir -p /run/apache2 && /usr/sbin/apachectl -DFOREGROUND"
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:haproxy]
command=/usr/sbin/haproxy -W -db -f /etc/haproxy/haproxy.cfg
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openresty]
command=/usr/local/openresty/bin/openresty -g "daemon off; pid /tmp/nginx.pid;"
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ✅ Envoy = HULING magsimula (priority 50) — Public Port 8080
[program:envoy]
command=/usr/local/bin/envoy -c /etc/envoy/envoy.yaml
priority=50
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:anti_ddos]
command=/usr/bin/python3 /usr/local/bin/anti_ddos.py
priority=60
autostart=true
autorestart=true
startsecs=1
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
