worker_processes 1;

pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {

    access_log /dev/stdout;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 60s;

    reset_timedout_connection on;
    types_hash_max_size 2048;

    client_max_body_size 64m;

    # ==========================================================
    # ANTI-DDoS / RATE LIMIT
    # ==========================================================

    limit_req_zone $binary_remote_addr
        zone=handshake_limit:10m
        rate=30r/s;

    limit_req_zone $binary_remote_addr
        zone=xhttp_limit:10m
        rate=60r/s;

    limit_req_zone $binary_remote_addr
        zone=grpc_limit:10m
        rate=30r/s;

    limit_conn_zone $binary_remote_addr
        zone=conn_limit:10m;

    # Rate-limit response
    limit_req_status 429;

    # Connection-limit response
    limit_conn_status 403;


    # ==========================================================
    # WEBSOCKET CONNECTION HEADER
    # ==========================================================

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }


    # ==========================================================
    # XRAY UPSTREAMS
    # ==========================================================

    upstream trojan_ws {
        server 127.0.0.1:10000;
    }

    upstream trojan_hu {
        server 127.0.0.1:10001;
    }

    upstream trojan_xhttp {
        server 127.0.0.1:10002;
    }

    upstream trojan_grpc {
        server 127.0.0.1:10003;
    }


    upstream vmess_ws {
        server 127.0.0.1:10004;
    }

    upstream vmess_hu {
        server 127.0.0.1:10005;
    }

    upstream vmess_xhttp {
        server 127.0.0.1:10006;
    }

    upstream vmess_grpc {
        server 127.0.0.1:10007;
    }


    upstream vless_ws {
        server 127.0.0.1:10008;
    }

    upstream vless_hu {
        server 127.0.0.1:10009;
    }

    upstream vless_xhttp {
        server 127.0.0.1:10010;
    }

    upstream vless_grpc {
        server 127.0.0.1:10011;
    }


    upstream ss_ws {
        server 127.0.0.1:10012;
    }

    upstream ss_hu {
        server 127.0.0.1:10013;
    }

    upstream ss_xhttp {
        server 127.0.0.1:10014;
    }

    upstream ss_grpc {
        server 127.0.0.1:10015;
    }


    # ==========================================================
    # HTTP / WEBSOCKET / HTTPUPGRADE / XHTTP
    #
    # ENVoy :8080
    #       ↓
    # OpenResty :8081
    # ==========================================================

    server {

        listen 8081;
        server_name _;

        limit_conn conn_limit 512;


        # ======================================================
        # PANEL
        # ======================================================

        location / {

            root /usr/share/nginx/html;

            index index.html;

            try_files $uri $uri/ /index.html;
        }


        # ======================================================
        # TROJAN WEBSOCKET
        # ======================================================

        location = /openresty/trojan-virgozki {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://trojan_ws;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # TROJAN HTTPUPGRADE
        # ======================================================

        location = /openresty/trojan-virgozki-hu {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://trojan_hu;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # TROJAN XHTTP
        # ======================================================

        location = /openresty/trojan-virgozki-xhttp {

            limit_req
                zone=xhttp_limit
                burst=120
                nodelay;

            proxy_pass http://trojan_xhttp;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # VMESS WEBSOCKET
        # ======================================================

        location = /openresty/vmess-virgozki {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://vmess_ws;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # VMESS HTTPUPGRADE
        # ======================================================

        location = /openresty/vmess-virgozki-hu {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://vmess_hu;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # VMESS XHTTP
        # ======================================================

        location = /openresty/vmess-virgozki-xhttp {

            limit_req
                zone=xhttp_limit
                burst=120
                nodelay;

            proxy_pass http://vmess_xhttp;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # VLESS WEBSOCKET
        # ======================================================

        location = /openresty/vless-virgozki {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://vless_ws;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # VLESS HTTPUPGRADE
        # ======================================================

        location = /openresty/vless-virgozki-hu {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://vless_hu;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # VLESS XHTTP
        # ======================================================

        location = /openresty/vless-virgozki-xhttp {

            limit_req
                zone=xhttp_limit
                burst=120
                nodelay;

            proxy_pass http://vless_xhttp;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # SHADOWSOCKS WEBSOCKET
        # ======================================================

        location = /openresty/ss-virgozki {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://ss_ws;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # SHADOWSOCKS HTTPUPGRADE
        # ======================================================

        location = /openresty/ss-virgozki-hu {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://ss_hu;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ======================================================
        # SHADOWSOCKS XHTTP
        # ======================================================

        location = /openresty/ss-virgozki-xhttp {

            limit_req
                zone=xhttp_limit
                burst=120
                nodelay;

            proxy_pass http://ss_xhttp;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }


    # ==========================================================
    # gRPC LISTENER
    #
    # SEPARATE PORT REQUIRED FOR CLEAR-TEXT HTTP/2
    # ==========================================================

    server {

        listen 8082 http2;
        server_name _;

        limit_conn conn_limit 512;

        limit_req
            zone=grpc_limit
            burst=60
            nodelay;


        # ======================================================
        # TROJAN gRPC
        # ======================================================

        location = /openresty/trojan-grpc {

            grpc_pass grpc://trojan_grpc;

            grpc_set_header Host $host;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }


        # ======================================================
        # VMESS gRPC
        # ======================================================

        location = /openresty/vmess-grpc {

            grpc_pass grpc://vmess_grpc;

            grpc_set_header Host $host;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }


        # ======================================================
        # VLESS gRPC
        # ======================================================

        location = /openresty/vless-grpc {

            grpc_pass grpc://vless_grpc;

            grpc_set_header Host $host;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }


        # ======================================================
        # SHADOWSOCKS gRPC
        # ======================================================

        location = /openresty/ss-grpc {

            grpc_pass grpc://ss_grpc;

            grpc_set_header Host $host;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }
    }
}
