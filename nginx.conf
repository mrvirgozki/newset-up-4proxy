worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/openresty.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {

    include       mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 3600s;
    keepalive_requests 10000;

    client_header_timeout 60s;
    client_body_timeout 3600s;
    send_timeout 3600s;

    client_max_body_size 64m;

    server_tokens off;


    # ========================================================
    # ANTI-DDOS / RATE LIMIT
    # ========================================================

    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=30r/s;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;


    # ========================================================
    # UPSTREAMS
    # ========================================================

    upstream haproxy_http {
        server 127.0.0.1:8081;
        keepalive 128;
    }

    upstream haproxy_grpc {
        server 127.0.0.1:8084;
    }


    # ========================================================
    # PUBLIC SERVER
    # ========================================================

    server {

        # Cloud Run --use-http2 requires h2c.
        listen 0.0.0.0:8080 http2;

        server_name _;

        limit_conn conn_limit 10000;


        # ====================================================
        # HEALTH
        # ====================================================

        location = /health {

            access_log off;

            default_type text/plain;

            return 200 "ok\n";
        }


        # ====================================================
        # gRPC
        # ====================================================

        location ^~ /vless-grpc-virgozki/ {

            limit_req zone=grpc_limit burst=60 nodelay;
            limit_req_status 429;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;

            grpc_connect_timeout 30s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            grpc_pass grpc://haproxy_grpc;
        }


        location ^~ /vmess-grpc-virgozki/ {

            limit_req zone=grpc_limit burst=60 nodelay;
            limit_req_status 429;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;

            grpc_connect_timeout 30s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            grpc_pass grpc://haproxy_grpc;
        }


        location ^~ /trojan-grpc-virgozki/ {

            limit_req zone=grpc_limit burst=60 nodelay;
            limit_req_status 429;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;

            grpc_connect_timeout 30s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            grpc_pass grpc://haproxy_grpc;
        }


        location ^~ /ss-grpc-virgozki/ {

            limit_req zone=grpc_limit burst=60 nodelay;
            limit_req_status 429;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;

            grpc_connect_timeout 30s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            grpc_pass grpc://haproxy_grpc;
        }


        # ====================================================
        # WEBSOCKET
        # ====================================================

        location = /virgozki {

            limit_req zone=ws_limit burst=60 nodelay;
            limit_req_status 429;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_pass http://haproxy_http;
        }


        location = /vmess-virgozki {

            limit_req zone=ws_limit burst=60 nodelay;
