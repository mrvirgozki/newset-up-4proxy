worker_processes 1;

pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
worker_connections 4096;
multi_accept on;
}

http {

access_log /dev/stdout;
server_tokens off;

sendfile on;
tcp_nopush on;
tcp_nodelay on;

keepalive_timeout 65s;
client_header_timeout 15s;
client_body_timeout 60s;

reset_timedout_connection on;
types_hash_max_size 2048;

client_max_body_size 64m;

# ==========================================================
# ANTI-DDOS
# ==========================================================

limit_req_zone $binary_remote_addr
    zone=handshake_limit:10m
    rate=30r/s;

limit_req_zone $binary_remote_addr
    zone=xhttp_limit:10m
    rate=60r/s;

limit_req_zone $binary_remote_addr
    zone=grpc_limit:10m
    rate=30r/s;

limit_conn_zone $binary_remote_addr
    zone=conn_limit:10m;

limit_req_status 429;
limit_conn_status 403;

# ==========================================================
# WEBSOCKET
# ==========================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ==========================================================
# APACHE BACKEND
# ==========================================================

upstream apache_http {
    server 127.0.0.1:8083;
    keepalive 64;
}

# ==========================================================
# HTTP / WS / HTTPUPGRADE / XHTTP
# ==========================================================

server {

    listen 8082;
    server_name _;

    limit_conn conn_limit 512;

    # ------------------------------------------------------
    # PANEL
    # ------------------------------------------------------

    location / {

        root /usr/share/nginx/html;

        index index.html;

        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------
    # TROJAN WS
    # ------------------------------------------------------

    location = /openresty/trojan-virgozki {

        limit_req
            zone=handshake_limit
            burst=60
            nodelay;

        proxy_pass http://apache_http;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------
    # TROJAN HTTPUPGRADE
    # ------------------------------------------------------

    location = /openresty/trojan-virgozki-hu {

        limit_req
