worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 60s;

    reset_timedout_connection on;
    types_hash_max_size 2048;

    client_max_body_size 64m;

    limit_req_zone $binary_remote_addr zone=handshake_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=xhttp_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream (Tugma na sa Xray ports)
    upstream trojan_ws { server 127.0.0.1:10000; }
    upstream trojan_hu { server 127.0.0.1:10001; }
    upstream trojan_xhttp { server 127.0.0.1:10002; }
    upstream trojan_grpc { server 127.0.0.1:10003; }
    upstream vmess_ws { server 127.0.0.1:10004; }
    upstream vmess_hu { server 127.0.0.1:10005; }
    upstream vmess_xhttp { server 127.0.0.1:10006; }
    upstream vmess_grpc { server 127.0.0.1:10007; }
    upstream vless_ws { server 127.0.0.1:10008; }
    upstream vless_hu { server 127.0.0.1:10009; }
    upstream vless_xhttp { server 127.0.0.1:10010; }
    upstream vless_grpc { server 127.0.0.1:10011; }
    upstream ss_ws { server 127.0.0.1:10012; }
    upstream ss_hu { server 127.0.0.1:10013; }
    upstream ss_xhttp { server 127.0.0.1:10014; }
    upstream ss_grpc { server 127.0.0.1:10015; }

    # ==========================================================
    # PORT 8080 - Para sa Panel + Lahat ng Transport (Cloud Run Compatible)
    # ==========================================================
    server {
        listen 8080;
        server_name _;

        limit_conn conn_limit 512;
        limit_conn_status 403;

        # ✅ PANEL
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # --- TROJAN (May /openresty/ Prefix na!) ---
        location ^~ /openresty/trojan-virgozki {
            limit_req zone=handshake_limit burst=60 nodelay;
            proxy_pass http://trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location ^~ /openresty/trojan-virgozki-hu {
            limit_req zone=handshake_limit burst=60 nodelay;
            proxy_pass http://trojan_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location ^~ /openresty/trojan-virgozki-xhttp {
            limit_req zone=xhttp_limit burst=120 nodelay;
            proxy_pass http://trojan_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- VMESS ---
        location ^~ /openresty/vmess-virgozki {
            limit_req zone=handshake_limit burst=60 nodelay;
            proxy_pass http://vmess_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location ^~ /openresty/vmess-virgozki-hu {
            limit_req zone=handshake_limit burst=60 nodelay;
            proxy_pass http://vmess_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location ^~ /openresty/vmess-virgozki-xhttp {
            limit_req zone=xhttp_limit burst=120 nodelay;
            proxy_pass http://vmess_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # --- VLESS ---
        location ^~ /openresty/vless-virgozki {
            limit_req zone=handshake_limit burst=60 nodelay;
            proxy_pass http://vless_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location ^~ /openresty/vless-virgozki-hu {
            limit_req zone=handshake_limit burst=60 nodelay;
            proxy_pass http://vless_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location ^~ /openresty/vless-virgozki-xhttp {
            limit_req zone=xhttp_limit burst=120 nodelay;
            proxy_pass http://vless_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # --- SHADOWSOCKS ---
        location ^~ /openresty/ss-virgozki {
            limit_req zone=handshake_limit burst=60 nodelay;
            proxy_pass http://ss_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location ^~ /openresty/ss-virgozki-hu {
            limit_req zone=handshake_limit burst=60 nodelay;
            proxy_pass http://ss_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location ^~ /openresty/ss-virgozki-xhttp {
            limit_req zone=xhttp_limit burst=120 nodelay;
            proxy_pass http://ss_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # --- gRPC (Isinama na sa Port 8080 para iisang port lang bukas) ---
        listen 8080 http2;
        limit_req zone=grpc_limit burst=60 nodelay;
        http2_max_field_size 16k;
        http2_max_header_size 128k;
        http2_body_preread_size 64k;

        location = /openresty/trojan-grpc { grpc_pass grpc://trojan_grpc; }
        location = /openresty/vmess-grpc { grpc_pass grpc://vmess_grpc; }
        location = /openresty/vless-grpc { grpc_pass grpc://vless_grpc; }
        location = /openresty/ss-grpc { grpc_pass grpc://ss_grpc; }
    }
}
