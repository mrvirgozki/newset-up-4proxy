worker_processes 1;

pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {

    access_log /dev/stdout;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;

    client_header_timeout 15s;
    client_body_timeout 60s;

    reset_timedout_connection on;

    types_hash_max_size 2048;

    client_max_body_size 64m;


    # ==========================================================
    # ANTI-DDOS / RATE LIMITING
    # ==========================================================

    limit_req_zone $binary_remote_addr
        zone=handshake_limit:10m
        rate=30r/s;

    limit_req_zone $binary_remote_addr
        zone=xhttp_limit:10m
        rate=60r/s;

    limit_req_zone $binary_remote_addr
        zone=grpc_limit:10m
        rate=30r/s;

    limit_conn_zone $binary_remote_addr
        zone=conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 403;


    # ==========================================================
    # WEBSOCKET
    # ==========================================================

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }


    # ==========================================================
    # APACHE UPSTREAM
    # ==========================================================

    upstream apache_http {

        server 127.0.0.1:8083;

        keepalive 64;
    }


    upstream apache_grpc {

        server 127.0.0.1:8083;

        keepalive 64;
    }


    # ==========================================================
    # HTTP / WS / XHTTP / PANEL
    #
    # HAProxy :8081
    #       ↓
    # OpenResty :8082
    #       ↓
    # Apache :8083
    # ==========================================================

    server {

        listen 127.0.0.1:8082;

        server_name _;

        limit_conn conn_limit 512;


        # ======================================================
        # PANEL
        # ======================================================

        location / {

            root /usr/share/nginx/html;

            index index.html;

            try_files $uri $uri/ /index.html;
        }


        # ======================================================
        # TROJAN
        # ======================================================

        location = /openresty/trojan-virgozki {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        location = /openresty/trojan-virgozki-hu {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        location = /openresty/trojan-virgozki-xhttp {

            limit_req
                zone=xhttp_limit
                burst=120
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header Connection "";

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_request_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        # ======================================================
        # VMESS
        # ======================================================

        location = /openresty/vmess-virgozki {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        location = /openresty/vmess-virgozki-hu {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        location = /openresty/vmess-virgozki-xhttp {

            limit_req
                zone=xhttp_limit
                burst=120
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header Connection "";

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_request_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        # ======================================================
        # VLESS
        # ======================================================

        location = /openresty/vless-virgozki {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        location = /openresty/vless-virgozki-hu {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        location = /openresty/vless-virgozki-xhttp {

            limit_req
                zone=xhttp_limit
                burst=120
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header Connection "";

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_request_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        # ======================================================
        # SHADOWSOCKS
        # ======================================================

        location = /openresty/ss-virgozki {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        location = /openresty/ss-virgozki-hu {

            limit_req
                zone=handshake_limit
                burst=60
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }


        location = /openresty/ss-virgozki-xhttp {

            limit_req
                zone=xhttp_limit
                burst=120
                nodelay;

            proxy_pass http://apache_http;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header Connection "";

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;

            proxy_request_buffering off;

            proxy_read_timeout 3600s;

            proxy_send_timeout 3600s;
        }

    }


    # ==========================================================
    # gRPC
    #
    # HAProxy :8084
    #       ↓
    # OpenResty :8085
    #       ↓
    # Apache :8083
    # ==========================================================

    server {

        listen 127.0.0.1:8085 http2;

        server_name _;

        limit_conn conn_limit 512;


        location = /openresty/trojan-grpc {

            limit_req
                zone=grpc_limit
                burst=60
                nodelay;

            grpc_pass grpc://apache_grpc;

            grpc_set_header Host $host;

            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_read_timeout 3600s;

            grpc_send_timeout 3600s;
        }


        location = /openresty/vmess-grpc {

            limit_req
                zone=grpc_limit
                burst=60
                nodelay;

            grpc_pass grpc://apache_grpc;

            grpc_set_header Host $host;

            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_read_timeout 3600s;

            grpc_send_timeout 3600s;
        }


        location = /openresty/vless-grpc {

            limit_req
                zone=grpc_limit
                burst=60
                nodelay;

            grpc_pass grpc://apache_grpc;

            grpc_set_header Host $host;

            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_read_timeout 3600s;

            grpc_send_timeout 3600s;
        }


        location = /openresty/ss-grpc {

            limit_req
                zone=grpc_limit
                burst=60
                nodelay;

            grpc_pass grpc://apache_grpc;

            grpc_set_header Host $host;

            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_read_timeout 3600s;

            grpc_send_timeout 3600s;
        }

    }

}
