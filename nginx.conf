worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {

    include /usr/local/openresty/nginx/conf/mime.types;

    default_type application/octet-stream;

    log_format main
        '$remote_addr - $host [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    client_max_body_size 32m;

    server_tokens off;

    limit_req_zone $binary_remote_addr
        zone=general:10m
        rate=20r/s;

    limit_conn_zone $binary_remote_addr
        zone=addr:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ---------------------------------------------------------
    # INTERNAL HTTP PROXIES
    # ---------------------------------------------------------

    upstream haproxy_backend {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    upstream envoy_backend {
        server 127.0.0.1:8082;
        keepalive 32;
    }

    upstream apache_backend {
        server 127.0.0.1:8083;
        keepalive 32;
    }

    # HAProxy TCP gRPC listener
    upstream haproxy_grpc {
        server 127.0.0.1:8084;
    }

    # ---------------------------------------------------------
    # XRAY WS / HTTPUPGRADE / XHTTP
    # ---------------------------------------------------------

    upstream trojan_ws {
        server 127.0.0.1:10000;
    }

    upstream trojan_hu {
        server 127.0.0.1:10001;
    }

    upstream trojan_xhttp {
        server 127.0.0.1:10002;
    }

    upstream vmess_ws {
        server 127.0.0.1:10003;
    }

    upstream vmess_hu {
        server 127.0.0.1:10004;
    }

    upstream vmess_xhttp {
        server 127.0.0.1:10005;
    }

    upstream vless_ws {
        server 127.0.0.1:10006;
    }

    upstream vless_hu {
        server 127.0.0.1:10007;
    }

    upstream vless_xhttp {
        server 127.0.0.1:10008;
    }

    upstream ss_ws {
        server 127.0.0.1:10009;
    }

    upstream ss_hu {
        server 127.0.0.1:10010;
    }

    upstream ss_xhttp {
        server 127.0.0.1:10011;
    }

    # ---------------------------------------------------------
    # XRAY gRPC
    # ---------------------------------------------------------

    upstream vless_grpc {
        server 127.0.0.1:10012;
    }

    upstream vmess_grpc {
        server 127.0.0.1:10013;
    }

    upstream trojan_grpc {
        server 127.0.0.1:10014;
    }

    upstream ss_grpc {
        server 127.0.0.1:10015;
    }

    server {

        listen 8080;
        listen [::]:8080;

        server_name _;

        limit_conn addr 100;

        # =====================================================
        # HEALTH
        # =====================================================

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # =====================================================
        # OPENRESTY DIRECT - TROJAN
        # =====================================================

        location = /virgozki {

            proxy_pass http://trojan_ws;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location = /virgozki-hu {

            proxy_pass http://trojan_hu;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location = /virgozki-xhttp {

            proxy_pass http://trojan_xhttp;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # =====================================================
        # OPENRESTY DIRECT - VMESS
        # =====================================================

        location = /vmess-virgozki {

            proxy_pass http://vmess_ws;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location = /vmess-virgozki-hu {

            proxy_pass http://vmess_hu;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location = /vmess-virgozki-xhttp {

            proxy_pass http://vmess_xhttp;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # =====================================================
        # OPENRESTY DIRECT - VLESS
        # =====================================================

        location = /vless-virgozki {

            proxy_pass http://vless_ws;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location = /vless-virgozki-hu {

            proxy_pass http://vless_hu;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location = /vless-virgozki-xhttp {

            proxy_pass http://vless_xhttp;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # =====================================================
        # OPENRESTY DIRECT - SHADOWSOCKS
        # =====================================================

        location = /ss-virgozki {

            proxy_pass http://ss_ws;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location = /ss-virgozki-hu {

            proxy_pass http://ss_hu;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
        }

        location = /ss-virgozki-xhttp {

            proxy_pass http://ss_xhttp;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # =====================================================
        # OPENRESTY DIRECT - gRPC
        #
        # IMPORTANT:
        # Cloud Run must use HTTP/2 end-to-end for native gRPC.
        # =====================================================

        location ^~ /vless-grpc-virgozki {

            grpc_pass grpc://vless_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /vmess-grpc-virgozki {

            grpc_pass grpc://vmess_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /trojan-grpc-virgozki {

            grpc_pass grpc://trojan_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /ss-grpc-virgozki {

            grpc_pass grpc://ss_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        # =====================================================
        # HAPROXY ROUTE
        # =====================================================

        location ^~ /proxy/haproxy/ {

            proxy_pass http://haproxy_backend/;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # HAProxy gRPC
        location ^~ /proxy/haproxy/vless-grpc-virgozki {

            rewrite ^/proxy/haproxy/(.*)$ /$1 break;

            grpc_pass grpc://haproxy_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/haproxy/vmess-grpc-virgozki {

            rewrite ^/proxy/haproxy/(.*)$ /$1 break;

            grpc_pass grpc://haproxy_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/haproxy/trojan-grpc-virgozki {

            rewrite ^/proxy/haproxy/(.*)$ /$1 break;

            grpc_pass grpc://haproxy_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/haproxy/ss-grpc-virgozki {

            rewrite ^/proxy/haproxy/(.*)$ /$1 break;

            grpc_pass grpc://haproxy_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        # =====================================================
        # ENVOY ROUTE
        # =====================================================

        location ^~ /proxy/envoy/ {

            proxy_pass http://envoy_backend/;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # =====================================================
        # ENVOY gRPC
        # =====================================================

        location ^~ /proxy/envoy/vless-grpc-virgozki {

            rewrite ^/proxy/envoy/(.*)$ /$1 break;

            grpc_pass grpc://127.0.0.1:8082;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/envoy/vmess-grpc-virgozki {

            rewrite ^/proxy/envoy/(.*)$ /$1 break;

            grpc_pass grpc://127.0.0.1:8082;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/envoy/trojan-grpc-virgozki {

            rewrite ^/proxy/envoy/(.*)$ /$1 break;

            grpc_pass grpc://127.0.0.1:8082;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/envoy/ss-grpc-virgozki {

            rewrite ^/proxy/envoy/(.*)$ /$1 break;

            grpc_pass grpc://127.0.0.1:8082;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        # =====================================================
        # APACHE ROUTE
        # =====================================================

        location ^~ /proxy/apache/ {

            proxy_pass http://apache_backend/;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # =====================================================
        # APACHE gRPC
        # =====================================================

        location ^~ /proxy/apache/vless-grpc-virgozki {

            rewrite ^/proxy/apache/(.*)$ /$1 break;

            grpc_pass grpc://127.0.0.1:8083;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/apache/vmess-grpc-virgozki {

            rewrite ^/proxy/apache/(.*)$ /$1 break;

            grpc_pass grpc://127.0.0.1:8083;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/apache/trojan-grpc-virgozki {

            rewrite ^/proxy/apache/(.*)$ /$1 break;

            grpc_pass grpc://127.0.0.1:8083;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location ^~ /proxy/apache/ss-grpc-virgozki {

            rewrite ^/proxy/apache/(.*)$ /$1 break;

            grpc_pass grpc://127.0.0.1:8083;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        # =====================================================
        # NORMAL WEB
        # =====================================================

        location / {

            limit_req
                zone=general
                burst=40
                nodelay;

            proxy_pass http://haproxy_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
