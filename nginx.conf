worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 86400s;
    client_header_timeout 3600s;
    client_body_timeout 86400s;
    client_max_body_size 64m;

    # Anti DDoS — PARA LANG SA PROXY PATHS
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=xhttp_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 403;

    # Websocket Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Apache Backend
    upstream apache_http {
        server 127.0.0.1:8083;
        keepalive 128;
        keepalive_timeout 7200s;
        keepalive_requests 10000;
    }

    # ==============================================
    # MAIN SERVER — PANEL WALANG LIMIT
    # ==============================================
    server {
        listen 0.0.0.0:8080 http2;
        server_name _;
        # ❌ TINANGGAL ANG GLOBAL LIMIT — para hindi makaapekto sa panel

        # ✅ PANEL — SIGURADONG LIBRE SA ANUMANG LIMIT
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ✅ PROXY PATHS LANG ANG MAY PROTEKSIYON
        location ~ ^/openresty/(trojan|vmess|vless|ss)-virgozki(-hu)?$ {
            limit_req zone=ws_limit burst=60 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://apache_http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
        }

        location ~ ^/openresty/(trojan|vmess|vless|ss)-virgozki-xhttp$ {
            limit_req zone=xhttp_limit burst=120 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://apache_http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
        }
    }

    # ==============================================
    # gRPC SERVER — MAY PROTEKSIYON
    # ==============================================
    server {
        listen 0.0.0.0:8085 http2;
        server_name _;

        location /openresty/trojan-grpc {
            limit_req zone=grpc_limit burst=60 nodelay;
            limit_conn conn_limit 10;
            grpc_pass grpc://127.0.0.1:10003;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
        }

        location /openresty/vmess-grpc {
            limit_req zone=grpc_limit burst=60 nodelay;
            limit_conn conn_limit 10;
            grpc_pass grpc://127.0.0.1:10007;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
        }

        location /openresty/vless-grpc {
            limit_req zone=grpc_limit burst=60 nodelay;
            limit_conn conn_limit 10;
            grpc_pass grpc://127.0.0.1:10011;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
        }

        location /openresty/ss-grpc {
            limit_req zone=grpc_limit burst=60 nodelay;
            limit_conn conn_limit 10;
            grpc_pass grpc://127.0.0.1:10015;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_set_header Host $host;
        }
    }
}

