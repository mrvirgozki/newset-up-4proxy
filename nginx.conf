worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/openresty.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 3600s;
    keepalive_requests 10000;

    client_header_timeout 60s;
    client_body_timeout 3600s;
    send_timeout 3600s;

    client_max_body_size 64m;
    server_tokens off;

    # ANTI-DDOS / RATE LIMIT
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # UPSTREAM: Tugma sa tamang Envoy port
    upstream envoy_main {
        server 127.0.0.1:8080;
        keepalive 128;
    }

    # ✅ PANLOBONG LANG: 8084 na lang, hindi na sa 8080
    server {
        listen 127.0.0.1:8084 http2;
        server_name _;
        limit_conn conn_limit 10000;

        # HEALTH CHECK
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # gRPC ROUTES
        location ^~ /vless-grpc-virgozki/ {
            limit_req zone=grpc_limit burst=60 nodelay;
            limit_req_status 429;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_connect_timeout 30s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_pass grpc://envoy_main;
        }

        location ^~ /vmess-grpc-virgozki/ {
            limit_req zone=grpc_limit burst=60 nodelay;
            limit_req_status 429;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_connect_timeout 30s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_pass grpc://envoy_main;
        }

        location ^~ /trojan-grpc-virgozki/ {
            limit_req zone=grpc_limit burst=60 nodelay;
            limit_req_status 429;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_connect_timeout 30s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_pass grpc://envoy_main;
        }

        location ^~ /ss-grpc-virgozki/ {
            limit_req zone=grpc_limit burst=60 nodelay;
            limit_req_status 429;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto https;
            grpc_connect_timeout 30s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_pass grpc://envoy_main;
        }

        # WEBSOCKET ROUTES
        location = /virgozki {
            limit_req zone=ws_limit burst=60 nodelay;
            limit_req_status 429;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /vmess-virgozki {
            limit_req zone=ws_limit burst=60 nodelay;
            limit_req_status 429;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /vless-virgozki {
            limit_req zone=ws_limit burst=60 nodelay;
            limit_req_status 429;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /ss-virgozki {
            limit_req zone=ws_limit burst=60 nodelay;
            limit_req_status 429;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        # HTTPUPGRADE ROUTES
        location = /virgozki-hu {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /vmess-virgozki-hu {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /vless-virgozki-hu {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /ss-virgozki-hu {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        # XHTTP ROUTES
        location = /virgozki-xhttp {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /vmess-virgozki-xhttp {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /vless-virgozki-xhttp {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        location = /ss-virgozki-xhttp {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # ✅ Inayos ang typo
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://envoy_main;
        }

        # DEFAULT / PANEL
        location / {
            limit_req zone=general_limit burst=100 nodelay;
            limit_req_status 429;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_pass http://envoy_main;
        }
    }
}
