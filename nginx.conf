worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    log_format main
        '$remote_addr - $host [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    client_max_body_size 32m;

    server_tokens off;

    limit_req_zone $binary_remote_addr
        zone=general:10m
        rate=20r/s;

    limit_conn_zone $binary_remote_addr
        zone=addr:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream haproxy_backend {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    upstream trojan_ws {
        server 127.0.0.1:10000;
    }

    upstream trojan_hu {
        server 127.0.0.1:10001;
    }

    upstream trojan_xhttp {
        server 127.0.0.1:10002;
    }

    upstream vmess_ws {
        server 127.0.0.1:10003;
    }

    upstream vmess_hu {
        server 127.0.0.1:10004;
    }

    upstream vmess_xhttp {
        server 127.0.0.1:10005;
    }

    upstream vless_ws {
        server 127.0.0.1:10006;
    }

    upstream vless_hu {
        server 127.0.0.1:10007;
    }

    upstream vless_xhttp {
        server 127.0.0.1:10008;
    }

    upstream ss_ws {
        server 127.0.0.1:10009;
    }

    upstream ss_hu {
        server 127.0.0.1:10010;
    }

    upstream ss_xhttp {
        server 127.0.0.1:10011;
    }

    upstream vless_grpc {
        server 127.0.0.1:10012;
    }

    upstream vmess_grpc {
        server 127.0.0.1:10013;
    }

    upstream trojan_grpc {
        server 127.0.0.1:10014;
    }

    upstream ss_grpc {
        server 127.0.0.1:10015;
    }

    server {
        listen 8080;
        listen [::]:8080;

        server_name _;

        limit_conn addr 100;

        location = /virgozki {
            proxy_pass http://trojan_ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /virgozki-hu {
            proxy_pass http://trojan_hu;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /virgozki-xhttp {
            proxy_pass http://trojan_xhttp;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /vmess-virgozki {
            proxy_pass http://vmess_ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /vmess-virgozki-hu {
            proxy_pass http://vmess_hu;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /vmess-virgozki-xhttp {
            proxy_pass http://vmess_xhttp;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /vless-virgozki {
            proxy_pass http://vless_ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /vless-virgozki-hu {
            proxy_pass http://vless_hu;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /vless-virgozki-xhttp {
            proxy_pass http://vless_xhttp;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /ss-virgozki {
            proxy_pass http://ss_ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /ss-virgozki-hu {
            proxy_pass http://ss_hu;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /ss-virgozki-xhttp {
            proxy_pass http://ss_xhttp;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /vless-grpc-virgozki {
            grpc_pass grpc://vless_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location = /vmess-grpc-virgozki {
            grpc_pass grpc://vmess_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location = /trojan-grpc-virgozki {
            grpc_pass grpc://trojan_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location = /ss-grpc-virgozki {
            grpc_pass grpc://ss_grpc;

            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }

        location / {
            limit_req zone=general burst=40 nodelay;

            proxy_pass http://haproxy_backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
