worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 60s;
    reset_timedout_connection on;

    # Basic L7 abuse control. Envoy in front provides the common limiter.
    limit_req_zone $binary_remote_addr zone=handshake_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=xhttp_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream trojan_ws { server 127.0.0.1:10000; }
    upstream trojan_hu { server 127.0.0.1:10001; }
    upstream trojan_xhttp { server 127.0.0.1:10002; }
    upstream vmess_ws { server 127.0.0.1:10004; }
    upstream vmess_hu { server 127.0.0.1:10005; }
    upstream vmess_xhttp { server 127.0.0.1:10006; }
    upstream vless_ws { server 127.0.0.1:10008; }
    upstream vless_hu { server 127.0.0.1:10009; }
    upstream vless_xhttp { server 127.0.0.1:10010; }
    upstream ss_ws { server 127.0.0.1:10012; }
    upstream ss_hu { server 127.0.0.1:10013; }
    upstream ss_xhttp { server 127.0.0.1:10014; }

    # HTTP/1.1 side: WS + HTTPUpgrade + XHTTP.
    server {
        listen 8101;
        server_name _;
        limit_conn conn_limit 512;
        limit_conn_status 403;

        location = / {
            root /usr/local/openresty/nginx/html;
            index index.html;
        }

        location /virgozki {
            limit_req zone=handshake_limit burst=60 nodelay;
            limit_req_status 403;
            proxy_pass http://trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /virgozki-hu {
            limit_req zone=handshake_limit burst=60 nodelay;
            limit_req_status 403;
            proxy_pass http://trojan_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /virgozki-xhttp {
            limit_req zone=xhttp_limit burst=120 nodelay;
            limit_req_status 429;
            proxy_pass http://trojan_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /vmess-virgozki {
            limit_req zone=handshake_limit burst=60 nodelay;
            limit_req_status 403;
            proxy_pass http://vmess_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /vmess-virgozki-hu {
            limit_req zone=handshake_limit burst=60 nodelay;
            limit_req_status 403;
            proxy_pass http://vmess_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /vmess-virgozki-xhttp {
            limit_req zone=xhttp_limit burst=120 nodelay;
            limit_req_status 429;
            proxy_pass http://vmess_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /vless-virgozki {
            limit_req zone=handshake_limit burst=60 nodelay;
            limit_req_status 403;
            proxy_pass http://vless_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /vless-virgozki-hu {
            limit_req zone=handshake_limit burst=60 nodelay;
            limit_req_status 403;
            proxy_pass http://vless_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /vless-virgozki-xhttp {
            limit_req zone=xhttp_limit burst=120 nodelay;
            limit_req_status 429;
            proxy_pass http://vless_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ss-virgozki {
            limit_req zone=handshake_limit burst=60 nodelay;
            limit_req_status 403;
            proxy_pass http://ss_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /ss-virgozki-hu {
            limit_req zone=handshake_limit burst=60 nodelay;
            limit_req_status 403;
            proxy_pass http://ss_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /ss-virgozki-xhttp {
            limit_req zone=xhttp_limit burst=120 nodelay;
            limit_req_status 429;
            proxy_pass http://ss_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            return 404;
        }
    }

    # HTTP/2 cleartext side dedicated to gRPC.
    server {
        listen 8102 http2;
        server_name _;
        limit_req_status 429;
        limit_conn_status 403;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        grpc_socket_keepalive on;

        location = /trojan-grpc { limit_req zone=grpc_limit burst=60 nodelay; grpc_pass 127.0.0.1:10003; }
        location = /vmess-grpc { limit_req zone=grpc_limit burst=60 nodelay; grpc_pass 127.0.0.1:10007; }
        location = /vless-grpc { limit_req zone=grpc_limit burst=60 nodelay; grpc_pass 127.0.0.1:10011; }
        location = /ss-grpc { limit_req zone=grpc_limit burst=60 nodelay; grpc_pass 127.0.0.1:10015; }
        location / { return 404; }
    }
}
